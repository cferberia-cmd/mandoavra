<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVRA Jaén · Control de Incidencias</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --green-dark:#1a3c2e;--green:#2d6a4f;--green-mid:#40916c;--green-light:#74c69d;--green-xlight:#d8f3dc;--green-bg:#f0faf4;
  --sidebar-w:220px;--bottomnav-h:64px;--bg:#f4f6f5;--surface:#fff;--border:#e4ebe7;--text:#111827;--text-sec:#6b7a74;--text-ter:#a0aea8;
  --danger:#e63946;--danger-light:#fff0f0;--warning:#f4a261;--warning-light:#fff7ee;
  --info:#457b9d;--info-light:#eaf2f8;--purple:#6d597a;--purple-light:#f3f0f7;
  --shadow:0 2px 8px rgba(0,0,0,.07);--shadow-lg:0 8px 24px rgba(0,0,0,.10);
  --r:16px;--r-sm:10px;--r-xs:6px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;font-size:14px;background:var(--bg);color:var(--text);}

/* ── LAYOUT ── */
.app{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:var(--sidebar-w);background:var(--green-dark);display:flex;flex-direction:column;flex-shrink:0;z-index:100;}
.sidebar-logo{padding:24px 20px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-logo-icon{width:36px;height:36px;background:var(--green-mid);border-radius:10px;display:flex;align-items:center;justify-content:center;}
.sidebar-logo-icon svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;}
.sidebar-logo-text{font-size:15px;font-weight:700;color:#fff;}
.sidebar-logo-sub{font-size:10px;color:rgba(255,255,255,.4);margin-top:1px;letter-spacing:.04em;text-transform:uppercase;}
.sidebar-nav{padding:16px 12px;flex:1;}
.nav-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.3);padding:0 8px;margin-bottom:8px;margin-top:16px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);color:rgba(255,255,255,.6);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;font-family:inherit;}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff;}
.nav-item.active{background:var(--green-mid);color:#fff;font-weight:600;}
.nav-item svg{width:16px;height:16px;flex-shrink:0;}
.nav-badge{margin-left:auto;background:var(--green-light);color:var(--green-dark);font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px;}
.sidebar-footer{padding:16px 12px;border-top:1px solid rgba(255,255,255,.08);}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{height:64px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;box-shadow:var(--shadow);}
.topbar-title{font-size:16px;font-weight:700;flex:1;}
.live-chip{display:flex;align-items:center;gap:5px;background:var(--green-xlight);color:var(--green);padding:5px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green-mid);box-shadow:0 0 0 3px rgba(64,145,108,.2);flex-shrink:0;}
.content-area{flex:1;overflow-y:auto;padding:20px;}

/* ── BOTTOM NAV (móvil/tablet) ── */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:var(--bottomnav-h);background:var(--green-dark);border-top:1px solid rgba(255,255,255,.1);z-index:200;flex-direction:row;align-items:stretch;}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:rgba(255,255,255,.5);font-size:10px;font-weight:600;cursor:pointer;border:none;background:none;font-family:inherit;padding:8px 4px;transition:all .15s;}
.bn-item.active{color:var(--green-light);}
.bn-item svg{width:20px;height:20px;}
.bn-badge{background:var(--green-light);color:var(--green-dark);font-size:9px;font-weight:800;padding:1px 5px;border-radius:20px;margin-top:-2px;}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;transition:all .15s;}
.btn:hover{background:var(--green-xlight);border-color:var(--green-light);color:var(--green);}
.btn-primary{background:var(--green);color:#fff;border-color:var(--green);}
.btn-primary:hover{background:var(--green-dark);}
.btn-sm{padding:6px 12px;font-size:11px;}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger);}

/* ── RESPONSIVE BREAKPOINTS ── */
@media(max-width:1024px){
  .sidebar{display:none;}
  .bottom-nav{display:flex;}
  .content-area{padding:16px;padding-bottom:calc(var(--bottomnav-h) + 16px);}
  .topbar{padding:0 16px;}
  .topbar-title{font-size:15px;}
  #dashTab-filters{display:none;}
  #filterDrawer{display:block;}
}
@media(max-width:640px){
  .content-area{padding:12px;padding-bottom:calc(var(--bottomnav-h) + 12px);}
  .topbar-title{font-size:14px;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
  .kpi-value{font-size:22px;}
  .alert-kpis{grid-template-columns:repeat(2,1fr);}
  .alert-kpi-value{font-size:20px;}
  .charts-grid{grid-template-columns:1fr;}
  .modal{margin:8px;border-radius:var(--r-sm);}
  .modal-body{padding:14px;}
  .modal-hdr{padding:14px 16px;}
  .map-shell{grid-template-columns:1fr;height:auto;}
  #mapSidebar{display:none;}
}

/* FILTROS */
.filter-section{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:16px 20px;margin-bottom:20px;box-shadow:var(--shadow);}
.filter-section-title{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-sec);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.filter-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;}
.fg{display:flex;flex-direction:column;gap:5px;}
.fg label{font-size:10px;font-weight:700;color:var(--text-sec);letter-spacing:.06em;text-transform:uppercase;}
.fg select,.fg input{border:1.5px solid var(--border);border-radius:20px;padding:7px 14px;font-size:12px;color:var(--text);background:var(--bg);font-family:inherit;outline:none;transition:border-color .15s;min-width:130px;}
.fg select:focus,.fg input:focus{border-color:var(--green-mid);background:#fff;}
.filter-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:var(--green-xlight);color:var(--green);border-radius:20px;font-size:11px;font-weight:600;}
.chip-x{cursor:pointer;font-size:13px;line-height:1;}
.chip-x:hover{color:var(--danger);}

/* BLOQUES */
.block-title{font-size:13px;font-weight:700;color:var(--text-sec);letter-spacing:.04em;text-transform:uppercase;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--green-xlight);display:flex;align-items:center;gap:8px;}
.block-title span{background:var(--green);color:#fff;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}

/* KPI GRID */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px;}
.kpi-card{background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);cursor:pointer;transition:all .2s;border:1.5px solid transparent;position:relative;overflow:hidden;}
.kpi-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:var(--green-light);}
.kpi-card.featured{background:linear-gradient(135deg,var(--green-dark) 0%,var(--green) 100%);}
.kpi-card.no-click{cursor:default;}
.kpi-card.no-click:hover{transform:none;box-shadow:var(--shadow);}
.kpi-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
.kpi-icon svg{width:18px;height:18px;}
.kpi-label{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-sec);margin-bottom:6px;}
.kpi-card.featured .kpi-label{color:rgba(255,255,255,.7);}
.kpi-value{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-bottom:4px;}
.kpi-card.featured .kpi-value{color:#fff;}
.kpi-sub{font-size:11px;color:var(--text-ter);line-height:1.4;}
.kpi-card.featured .kpi-sub{color:rgba(255,255,255,.5);}
.kpi-sparkline{margin-top:10px;height:36px;}

/* ALERT BLOCK */
.alert-block{background:linear-gradient(135deg,#fff0f0,#fff5f0);border:1.5px solid #fecaca;border-radius:var(--r);padding:20px 24px;margin-bottom:20px;}
.alert-block-title{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--danger);margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.alert-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
.alert-kpi{background:rgba(255,255,255,.7);border-radius:var(--r-sm);padding:14px;cursor:pointer;transition:all .15s;border:1px solid #fecaca;}
.alert-kpi:hover{background:#fff;box-shadow:var(--shadow);}
.alert-kpi.no-click{cursor:default;}
.alert-kpi.no-click:hover{background:rgba(255,255,255,.7);box-shadow:none;}
.alert-kpi-label{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-sec);margin-bottom:6px;}
.alert-kpi-value{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:3px;}
.alert-kpi-sub{font-size:10px;color:var(--text-ter);}

/* CHARTS */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
.charts-grid.full{grid-template-columns:1fr;}
@media(max-width:900px){.charts-grid{grid-template-columns:1fr;}}
.card{background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);margin-bottom:16px;border:1.5px solid var(--border);}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
.card-title{font-size:13px;font-weight:700;}
.card-subtitle{font-size:11px;color:var(--text-ter);background:var(--bg);padding:3px 10px;border-radius:20px;}
.chart-wrap{position:relative;}
.chart-wrap.h200{height:200px;}
.chart-wrap.h260{height:260px;}
.chart-wrap.h300{height:300px;}
.chart-wrap.h340{height:340px;}
.donut-legend{display:flex;flex-direction:column;gap:7px;margin-top:12px;}
.dl-item{display:flex;align-items:center;justify-content:space-between;font-size:11px;}
.dl-left{display:flex;align-items:center;gap:7px;color:var(--text-sec);}
.dl-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0;}
.dl-pct{font-weight:700;}

/* TABLE */
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-ter);padding:8px 10px;border-bottom:1.5px solid var(--border);white-space:nowrap;}
tbody td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:var(--green-bg);}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap;}
.badge.ok{background:var(--green-xlight);color:var(--green);}
.badge.warn{background:var(--warning-light);color:#c07a30;}
.badge.danger{background:var(--danger-light);color:var(--danger);}
.badge.neutral{background:var(--bg);color:var(--text-sec);}
.badge.info{background:var(--info-light);color:var(--info);}
.exp-link{color:var(--green);font-weight:700;cursor:pointer;}
.exp-link:hover{text-decoration:underline;}

/* MAP */
#mapTab{display:none;}
.map-shell{display:grid;grid-template-columns:280px 1fr;gap:16px;height:calc(100vh - 200px);min-height:500px;}
.map-sidebar{background:var(--surface);border-radius:var(--r);padding:16px;overflow-y:auto;box-shadow:var(--shadow);border:1.5px solid var(--border);display:flex;flex-direction:column;gap:12px;}
.map-sidebar-title{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-ter);margin-bottom:4px;}
.legend-pin{width:12px;height:12px;border-radius:50%;flex-shrink:0;border:2px solid rgba(0,0,0,.12);}
.geo-progress{font-size:11px;color:var(--text-sec);background:var(--bg);border-radius:var(--r-sm);padding:10px 12px;}
.geo-bar-wrap{background:var(--border);border-radius:20px;height:4px;margin-top:6px;overflow:hidden;}
.geo-bar{height:4px;border-radius:20px;background:var(--green-mid);transition:width .3s;}
.map-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.map-stat{background:var(--green-bg);border-radius:var(--r-sm);padding:10px;text-align:center;border:1px solid var(--green-xlight);}
.map-stat-val{font-size:18px;font-weight:800;color:var(--green);}
.map-stat-label{font-size:10px;color:var(--text-ter);margin-top:2px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
.map-inc-list{flex:1;overflow-y:auto;}
.map-inc-item{padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;border:1.5px solid transparent;margin-bottom:4px;}
.map-inc-item:hover{background:var(--green-bg);border-color:var(--green-xlight);}
.map-inc-exp{font-size:12px;font-weight:700;color:var(--green);}
.map-inc-mun{font-size:11px;color:var(--text-sec);margin-top:1px;}
#map{border-radius:var(--r);border:1.5px solid var(--border);box-shadow:var(--shadow);}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(17,24,39,.5);backdrop-filter:blur(6px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;}
.modal{background:var(--surface);border-radius:var(--r);width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.18);}
.modal.sm{max-width:860px;}.modal.lg{max-width:1160px;}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1.5px solid var(--border);flex-shrink:0;}
.modal-hdr h2{font-size:15px;font-weight:700;}
.modal-hdr-actions{display:flex;gap:8px;}
.modal-body{overflow:auto;padding:24px;flex:1;}
.modal-close{background:none;border:none;cursor:pointer;color:var(--text-sec);font-size:20px;padding:4px 8px;border-radius:var(--r-xs);font-family:inherit;line-height:1;}
.modal-close:hover{background:var(--bg);}
.ficha-section{margin-bottom:22px;}
.ficha-section-title{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-ter);margin-bottom:10px;padding-bottom:7px;border-bottom:1.5px solid var(--border);}
.ficha-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;}
.ficha-field .fl{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-ter);margin-bottom:3px;}
.ficha-field .fv{font-size:13px;font-weight:500;}
.recl{background:var(--green-bg);border-radius:var(--r-sm);padding:12px 14px;font-size:12px;line-height:1.6;color:var(--text-sec);white-space:pre-wrap;border-left:3px solid var(--green-mid);}
.placeholder{text-align:center;padding:48px 24px;color:var(--text-ter);}
.placeholder strong{display:block;font-size:15px;color:var(--text-sec);margin-bottom:6px;}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
      <div><div class="sidebar-logo-text">AVRA Jaén</div><div class="sidebar-logo-sub">Serveo · Contrato</div></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-label">Principal</div>
      <button class="nav-item active" id="navDash">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </button>
      <button class="nav-item" id="navMap">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
        Mapa de incidencias
        <span class="nav-badge" id="navMapBadge">…</span>
      </button>
      <div class="nav-label" style="margin-top:20px">Acciones</div>
      <button class="nav-item" id="navRefresh">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 4v6h6"/><path d="M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg>
        Actualizar datos
      </button>
    </nav>
    <div class="sidebar-footer">
      <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;">
        <div style="width:32px;height:32px;border-radius:50%;background:var(--green-mid);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;">CF</div>
        <div><div style="font-size:12px;font-weight:600;color:#fff">Serveo AVRA</div><div style="font-size:10px;color:rgba(255,255,255,.4)">Supervisor obras</div></div>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div style="flex:1"><div class="topbar-title">Control de Incidencias — Jaén</div></div>
      <div class="live-chip"><span class="live-dot"></span><span id="statusText">Cargando…</span></div>
    </div>
    <div class="content-area">

      <!-- BLOQUE 1: FILTROS -->
      <div class="filter-section" id="dashTab-filters">
        <div class="filter-section-title">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
          Filtros de búsqueda
        </div>
        <div class="filter-row">
          <div class="fg"><label>Año</label>
            <select id="filtroAnio"><option value="">— Todos —</option></select>
          </div>
          <div class="fg"><label>Fecha desde</label><input type="date" id="filtroDesde"></div>
          <div class="fg"><label>Hasta</label><input type="date" id="filtroHasta"></div>
          <div class="fg"><label>Municipio</label>
            <select id="filtroMunicipio"><option value="">— Todos —</option></select>
          </div>
          <div class="fg"><label>Estado</label>
            <select id="filtroEstado"><option value="">— Todos —</option></select>
          </div>
          <div class="fg"><label>Tipología</label>
            <select id="filtroTipologia"><option value="">— Todas —</option></select>
          </div>
          <div class="fg"><label>Filtrar fechas por</label>
            <select id="filtroTipoFecha">
              <option value="solicitud">F. Solicitud presupuesto</option>
              <option value="enviado">F. Enviado a AVRA</option>
              <option value="aprobacion">F. Aprobación AVRA</option>
              <option value="facturado">F. Facturado</option>
            </select>
          </div>
          <div style="display:flex;gap:8px;align-items:flex-end;">
            <button class="btn btn-primary btn-sm" id="btnAplicar">Aplicar</button>
            <button class="btn btn-sm" id="btnLimpiar">Limpiar</button>
          </div>
        </div>
        <div class="filter-chips" id="filterChips"></div>
      </div>

      <!-- CONTENIDO TABS -->
      <div id="dashTab">
        <div id="content"><div class="placeholder"><strong>Conectando…</strong>Cargando datos en vivo</div></div>
      </div>
      <div id="mapTab">
        <div class="map-shell">
          <div class="map-sidebar">
            <div><div class="map-sidebar-title">Estado · Filtrar</div><div id="mapLegend" style="display:flex;flex-direction:column;gap:4px;margin-bottom:10px;"></div></div>
            <div id="geoProgress" style="display:none;" class="geo-progress"><div id="geoText">Geocodificando…</div><div class="geo-bar-wrap"><div class="geo-bar" id="geoBar" style="width:0%"></div></div></div>
            <div class="map-stats" id="mapStats"></div>

<script>
const GIST_RAW="https://gist.githubusercontent.com/cferberia-cmd/428e16516bae61ac35c15be1c8b6fd8f/raw/incidencias.json";
const REFRESH_MS=5*60*1000;
const GEO_CACHE_KEY='avra_geo_v4';
let charts=[],rawRows=[],filteredRows=[],modalRows=[],modalTitleText='';
let KEYS={},leafletMap=null,markers=[],currentTab='dash';
let geoCache={};try{geoCache=JSON.parse(localStorage.getItem(GEO_CACHE_KEY)||'{}');}catch(e){geoCache={};}
let munMarkers={},dirMarkers={};
let activeEstados=new Set(['Pdte. presupuesto','Pdte. aprobación','Aprobado','Facturado','No procede','Sin estado']);

/* ─── UTILS ─── */
const norm=s=>s?String(s).trim().toUpperCase().replace(/[\s\n]+/g,' '):'';
function findKey(row,cands){const ks=Object.keys(row);for(const c of cands){const f=ks.find(k=>norm(k).includes(c));if(f)return f;}return null;}
function parseNum(v){if(!v&&v!==0)return 0;if(typeof v==='number')return v;const n=parseFloat(String(v).replace(/[^\d,.-]/g,'').replace(/\.(?=\d{3})/g,'').replace(',','.'));return isNaN(n)?0:n;}

function excelDate(v){
  if(v===null||v===undefined||v==='')return null;
  if(typeof v==='number'){if(v<1)return null;return new Date(Math.round((v-25569)*86400*1000));}
  if(typeof v==='string'){
    const s=v.trim();if(!s)return null;
    const nu=norm(s);
    if(nu.includes('NO PROCEDE')||nu.includes('PROCEDE'))return null;
    const n2=parseFloat(s);
    if(!isNaN(n2)&&n2>40000)return new Date(Math.round((n2-25569)*86400*1000));
    if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)){const p=s.split('/');const d=new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));return isNaN(d.getTime())?null:d;}
    if(/^\d{4}-\d{2}-\d{2}/.test(s)){const d=new Date(s);return isNaN(d.getTime())?null:d;}
    return null;
  }
  return null;
}

const fmtDate=v=>{const d=excelDate(v);return d?d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'}):'—';};
const monthKey=d=>d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`:null;
const monthLabel=k=>{if(!k)return'';const[y,m]=k.split('-');return`${['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'][parseInt(m)-1]} ${y}`;};
const euro=v=>'€ '+Math.round(v).toLocaleString('es-ES');
const euro2=v=>'€ '+parseFloat(v).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});

function addDiasLab(d,n){let cur=new Date(d),a=0;while(a<n){cur.setDate(cur.getDate()+1);if(cur.getDay()!==0&&cur.getDay()!==6)a++;}return cur;}
function diasLabTranscurridos(d1,d2){if(!d1||!d2)return 0;let c=0,cur=new Date(d1);cur.setHours(0,0,0,0);const e=new Date(d2);e.setHours(0,0,0,0);while(cur<e){cur.setDate(cur.getDate()+1);if(cur.getDay()!==0&&cur.getDay()!==6)c++;}return c;}
function diasLabRestantes(d1,d2){if(!d1||!d2)return 0;let c=0,cur=new Date(d1);const e=new Date(d2);while(cur<e){cur.setDate(cur.getDate()+1);if(cur.getDay()!==0&&cur.getDay()!==6)c++;}return c;}

function normEstado(s){
  s=norm(s);
  if(s.includes('NO PROCEDE'))return'No procede';
  if(s.includes('PENDIENTE PRESUPUESTO'))return'Pdte. presupuesto';
  if(s.includes('PENDIENTE APROBACION')||s.includes('PENDIENTE APROBACIÓN'))return'Pdte. aprobación';
  if(s.includes('PRESUPUESTO APROBADO'))return'Aprobado';
  if(s==='FACTURADO')return'Facturado';
  return s||'Sin estado';
}
function normObra(s,estadoServeo){
  s=norm(s);
  if(s.includes('FACTURADO'))return'Facturado';
  if(s.includes('EN EJECUCION')||s.includes('EN EJECUCIÓN'))return'En ejecución';
  if(s.includes('EJECUTADO'))return'Ejecutado';
  if(!s&&estadoServeo&&norm(estadoServeo)==='FACTURADO')return'Facturado';
  return s||'';
}
function normProv(s){s=norm(s);if(s.includes('CEION')&&s.includes('ALGUACIL'))return'CEION-Adán Alguacil';if(s.includes('CEION'))return'CEION';if(s.includes('SERVEO'))return'SERVEO';return s||'Sin asignar';}

const ESTADO_COLOR={'Pdte. presupuesto':'#f4a261','Pdte. aprobación':'#457b9d','Aprobado':'#2d6a4f','Facturado':'#6d597a','No procede':'#e63946'};
function colorForEstado(e){return ESTADO_COLOR[e]||'#6b7a74';}

function alertBadge(s,d){
  if(s==='excluida')return`<span class="badge neutral">Excluida</span>`;
  if(s==='cumplido')return`<span class="badge ok">✓ OK</span>`;
  if(s==='vencido')return`<span class="badge danger">⚠ Vencido</span>`;
  if(s==='warning')return`<span class="badge warn">⏱ ${d}d</span>`;
  if(s==='ok')return`<span class="badge ok">✓ ${d}d</span>`;
  return`<span class="badge neutral">—</span>`;
}
function destroyCharts(){charts.forEach(c=>c.destroy());charts=[];}
function sparkline(id,data,color){const ctx=document.getElementById(id);if(!ctx||!data.length)return;const c=new Chart(ctx,{type:'line',data:{labels:data.map((_,i)=>i),datasets:[{data,borderColor:color,borderWidth:2,fill:true,backgroundColor:color+'18',tension:.4,pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{display:false},y:{display:false}},animation:false}});charts.push(c);}

/* ─── PROCESS ROWS ─── */
function processRows(rows){
  if(!rows.length)return[];
  const s=rows[0];
  KEYS={
    exp:findKey(s,['NUMERO DE EXPEDIENTE','EXPEDIENTE']),
    titular:findKey(s,['TITULAR O REPRESENTANTE','TITULAR']),
    telefono:findKey(s,['TELÉFONO','TELEFONO']),
    tipoVia:findKey(s,['TIPO VÍA','TIPO VIA']),
    direccion:findKey(s,['DIRECCIÓN','DIRECCION']),
    numero:findKey(s,['Nº']),
    bloque:findKey(s,['BLOQUE']),
    piso:findKey(s,['PISO']),
    puerta:findKey(s,['PUERTA']),
    provincia:findKey(s,['PROVINCIA']),
    reclamacion:findKey(s,['CONTENIDO RECLAMACIÓN','CONTENIDO RECLAMACION']),
    est:findKey(s,['ESTADO SERVEO']),
    prov:findKey(s,['PROVEEDOR ASIGNADO','PROVEEDOR']),
    mun:findKey(s,['MUNICIPIO']),
    base:findKey(s,['BASE PRESUPUESTO SERVEO']),
    iva:findKey(s,['IVA']),
    total:findKey(s,['TOTAL']),
    obra:findKey(s,['ESTADO OBRA']),
    tipologia:findKey(s,['TIPOLOGIA','TIPOLOGÍA']),
    fSolicitud:findKey(s,['FECHA SOLICITUD DE PRESUPUESTO AVRA','FECHA SOLICITUD','FECHA PETICION']),
    fVisitado:findKey(s,['FECHA VISITADO']),
    fPresSub:findKey(s,['FECHA PRESUPUESTO SUBCONTRATA','FECHA PRESUPUESTO']),
    fEnviado:findKey(s,['FECHA ENVIADO A AVRA','ENVIADO A AVRA']),
    fApr:findKey(s,['FECHA APROBACION AVRA','APROBADO POR AVRA']),
    fCon:findKey(s,['FECHA CONFORMIDAD INCIDENCIA','FECHA CONFORMIDAD']),
    fFact:findKey(s,['FECHA FACTURADO','FACTURADO']),
    penal:findKey(s,['PENALIZACION CONTABILIZADA','PENALIZACION']),
    posPenal:findKey(s,['POSIBLE PENALIZACION']),
    plazo:findKey(s,['PLAZO EJECUCION MESES']),
    prior:findKey(s,['PRIORITARIO']),
    margen:findKey(s,['MARGEN BRUTO','MARGEN']),
    obsSub:findKey(s,['OBSERVACIONES SUBCONTRATA']),
    obsServ:findKey(s,['OBSERVACIONES SERVEO']),
    baseSub:findKey(s,['BASE PRESUPUESTO SUBCONTRATA'])
  };

  const HOY=new Date();HOY.setHours(0,0,0,0);

  return rows.map(r=>{
    const estado=normEstado(KEYS.est?r[KEYS.est]:null);
    const obraLabel=normObra(KEYS.obra?r[KEYS.obra]:'',KEYS.est?r[KEYS.est]:'');
    const base=Math.max(0,parseNum(KEYS.base?r[KEYS.base]:0));
    const total=parseNum(KEYS.total?r[KEYS.total]:0);
    const tipologia=KEYS.tipologia?String(r[KEYS.tipologia]||'').trim():'';

    // Penalización contabilizada
    const penalRawVal=KEYS.penal?r[KEYS.penal]:null;
    const penalStr=penalRawVal?String(penalRawVal).trim():'';
    const penalNum=parseFloat(penalStr.replace(/[^\d,.-]/g,'').replace(',','.'));
    const penalReal=penalStr===''?0:(isNaN(penalNum)?base*0.1:penalNum);
    const esPenalizada=penalStr!=='';

    // Posible penalización (texto libre)
    const posPenal=KEYS.posPenal?String(r[KEYS.posPenal]||'').trim():'';

    // Fecha facturado
    const fFactRawVal=KEYS.fFact?r[KEYS.fFact]:null;
    const fFactStr=fFactRawVal?norm(String(fFactRawVal)):'';
    const fFactDate=(!fFactStr||fFactStr.includes('NO PROCEDE')||fFactStr.includes('PROCEDE'))?null:excelDate(fFactRawVal);
    const estadoNorm=norm(KEYS.est?r[KEYS.est]:'');
    const esFacturada=fFactDate!==null||estadoNorm==='FACTURADO';
    const fFact=fFactDate;

    // Fechas
    const fSolVal=excelDate(KEYS.fSolicitud?r[KEYS.fSolicitud]:null);
    const fEnvVal=excelDate(KEYS.fEnviado?r[KEYS.fEnviado]:null);
    const fAprVal=excelDate(KEYS.fApr?r[KEYS.fApr]:null);
    const fConVal=excelDate(KEYS.fCon?r[KEYS.fCon]:null);
    const fVisVal=excelDate(KEYS.fVisitado?r[KEYS.fVisitado]:null);
    const fPresSubVal=excelDate(KEYS.fPresSub?r[KEYS.fPresSub]:null);

    // Excluida del control de plazos
    const excluida=(obraLabel==='Facturado'||estado==='No procede'||esFacturada);

    // Plazo presupuesto: 3 días lab desde solicitud hasta enviado a AVRA
    let p1Status='sin-fecha',p1Dias=null;
    if(!excluida&&fSolVal){
      const lim1=addDiasLab(fSolVal,3);
      if(fEnvVal){p1Status=fEnvVal<=lim1?'cumplido':'vencido';}
      else{const dr=diasLabRestantes(HOY,lim1);if(HOY>lim1){p1Status='vencido';}else if(dr<=3){p1Status='warning';p1Dias=dr;}else{p1Status='ok';p1Dias=dr;}}
    }

    // Control 60 días lab desde aprobación
    let pen60=null,pen60Dias=null;
    if(estado==='Aprobado'&&!esFacturada&&fAprVal){
      const dt=diasLabTranscurridos(fAprVal,HOY);
      const dr=60-dt;
      if(dt>=60){pen60='vencida';pen60Dias=dt-60;}
      else if(dr<=15){pen60='aviso';pen60Dias=dr;}
      else{pen60='plazo';pen60Dias=dr;}
    }

    // Tiempo tramitación: días lab entre solicitud y aprobación
    const diasTramitacion=(fSolVal&&fAprVal)?diasLabTranscurridos(fSolVal,fAprVal):null;

    const mu=KEYS.mun?String(r[KEYS.mun]||'').trim():'';
    const pr=KEYS.provincia?String(r[KEYS.provincia]||'').trim():'Jaén';
    const tv=KEYS.tipoVia?norm(r[KEYS.tipoVia]):'';
    const di=KEYS.direccion?String(r[KEYS.direccion]||'').trim():'';
    const nu=KEYS.numero?String(r[KEYS.numero]||'').trim():'';
    const bl=KEYS.bloque?String(r[KEYS.bloque]||'').trim():'';
    const pi=KEYS.piso?String(r[KEYS.piso]||'').trim():'';
    const pu=KEYS.puerta?String(r[KEYS.puerta]||'').trim():'';
    const fullAddr=[tv,di,nu,bl,pi,pu,mu,pr,'España'].filter(Boolean).join(', ');

    return{raw:r,exp:r[KEYS.exp]||'—',municipio:mu,estado,obraLabel,prov:normProv(KEYS.prov?r[KEYS.prov]:null),
      base,total,tipologia,penalReal,esPenalizada,posPenal,excluida,esFacturada,
      fSol:fSolVal,fEnv:fEnvVal,fApr:fAprVal,fCon:fConVal,fFact,fVis:fVisVal,fPresSub:fPresSubVal,
      p1Status,p1Dias,pen60,pen60Dias,diasTramitacion,
      prior:!!(KEYS.prior&&r[KEYS.prior]&&norm(r[KEYS.prior])!==''),
      fullAddr,geoKey:fullAddr.toLowerCase()};
  });
}

function closeDrawer(){document.getElementById('filterDrawer').style.display='none';}
function populateDrawer(){

    const bar=document.getElementById('filtro'+k);

}
function getDateForField(row,campo){
  if(campo==='solicitud')return row.fSol;
  if(campo==='enviado')return row.fEnv;
  if(campo==='aprobacion')return row.fApr;
  if(campo==='facturado')return row.fFact;
  return row.fSol;
}

/* ─── FILTROS ─── */
function applyFilters(){
  const anio=document.getElementById('filtroAnio').value;
  const dv=document.getElementById('filtroDesde').value;
  const hv=document.getElementById('filtroHasta').value;
  const desde=dv?new Date(dv):null;
  const hasta=hv?new Date(hv):null;
  const mun=document.getElementById('filtroMunicipio').value;
  const est=document.getElementById('filtroEstado').value;
  const tipo=document.getElementById('filtroTipologia').value;
  const campo=document.getElementById('filtroTipoFecha').value;

  filteredRows=rawRows.filter(r=>{
    // Año — filtra sobre TODAS las fechas disponibles
    if(anio){
      const fechas=[r.fSol,r.fEnv,r.fApr,r.fFact,r.fCon].filter(Boolean);
      const match=fechas.some(f=>f.getFullYear()===parseInt(anio));
      if(!match)return false;
    }
    // Rango de fechas
    const fd=getDateForField(r,campo);
    if(desde&&(!fd||fd<desde))return false;
    if(hasta){const h=new Date(hasta);h.setHours(23,59,59);if(!fd||fd>h)return false;}
    if(mun&&r.municipio!==mun)return false;
    if(est&&r.estado!==est)return false;
    if(tipo&&r.tipologia!==tipo)return false;
    return true;
  });

  updateFilterChips();
  if(currentTab==='dash')renderDashboard();else renderMap();
}

function limpiarFiltros(){
  ['filtroAnio','filtroMunicipio','filtroEstado','filtroTipologia','filtroTipoFecha'].forEach(id=>{
    const el=document.getElementById(id);
    if(el)el.selectedIndex=0;
  });
  document.getElementById('filtroDesde').value='';
  document.getElementById('filtroHasta').value='';
  filteredRows=[...rawRows];
  updateFilterChips();
  if(currentTab==='dash')renderDashboard();else renderMap();
}

function updateFilterChips(){
  const chips=[];
  const anio=document.getElementById('filtroAnio').value;
  const dv=document.getElementById('filtroDesde').value;
  const hv=document.getElementById('filtroHasta').value;
  const mun=document.getElementById('filtroMunicipio').value;
  const est=document.getElementById('filtroEstado').value;
  const tipo=document.getElementById('filtroTipologia').value;
  if(anio)chips.push(`Año: ${anio}`);
  if(dv)chips.push(`Desde: ${dv}`);
  if(hv)chips.push(`Hasta: ${hv}`);
  if(mun)chips.push(`Municipio: ${mun}`);
  if(est)chips.push(`Estado: ${est}`);
  if(tipo)chips.push(`Tipología: ${tipo}`);
  document.getElementById('filterChips').innerHTML=chips.map(c=>`<span class="chip">${c}<span class="chip-x" onclick="limpiarFiltros()">×</span></span>`).join('');
}

function populateFiltros(){
  const anios=new Set(),municipios=new Set(),estados=new Set(),tipologias=new Set();
  rawRows.forEach(r=>{
    [r.fSol,r.fEnv,r.fApr,r.fFact,r.fCon].filter(Boolean).forEach(f=>anios.add(f.getFullYear()));
    if(r.municipio&&r.municipio!=='—')municipios.add(r.municipio);
    if(r.estado)estados.add(r.estado);
    if(r.tipologia)tipologias.add(r.tipologia);
  });
  const pop=(id,items,cur)=>{
    const el=document.getElementById(id);if(!el)return;
    const first=el.options[0].text;
    el.innerHTML=`<option value="">${first}</option>`+[...items].sort((a,b)=>typeof a==='number'?b-a:String(a).localeCompare(String(b))).map(v=>`<option value="${v}"${v==cur?' selected':''}>${v}</option>`).join('');
  };
  pop('filtroAnio',[...anios],document.getElementById('filtroAnio').value);
  pop('filtroMunicipio',municipios,document.getElementById('filtroMunicipio').value);
  pop('filtroEstado',estados,document.getElementById('filtroEstado').value);
  pop('filtroTipologia',tipologias,document.getElementById('filtroTipologia').value);
  // Sincronizar drawer móvil
  populateDrawer();
}

const munGeoCache={};
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
async function geocodeMun(mun,intentos=3){if(munGeoCache[mun])return munGeoCache[mun];for(let i=0;i<intentos;i++){try{const q=encodeURIComponent(`${mun}, Jaén, España`);const res=await fetch(`https://nominatim.openstreetmap.org/search?q=${q}&format=json&limit=1&countrycodes=es`,{headers:{'Accept-Language':'es','User-Agent':'AVRAJaenDashboard/1.0'}});if(!res.ok){await sleep(2000*(i+1));continue;}const d=await res.json();if(d&&d[0]){const c={lat:parseFloat(d[0].lat),lng:parseFloat(d[0].lon)};munGeoCache[mun]=c;return c;}}catch(e){await sleep(2000*(i+1));}}return null;}
async function geocodeDir(row){if(geoCache[row.geoKey])return geoCache[row.geoKey];try{const res=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(row.fullAddr)}&format=json&limit=1&countrycodes=es`,{headers:{'Accept-Language':'es','User-Agent':'AVRAJaenDashboard/1.0'}});const d=await res.json();if(d&&d[0]){const c={lat:parseFloat(d[0].lat),lng:parseFloat(d[0].lon)};geoCache[row.geoKey]=c;localStorage.setItem(GEO_CACHE_KEY,JSON.stringify(geoCache));return c;}}catch(e){}return null;}
function mkPin(color,size=26){const h=Math.round(size*1.36);return L.divIcon({html:`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${h}" viewBox="0 0 28 38"><path d="M14 0C6.27 0 0 6.27 0 14c0 9.63 14 24 14 24S28 23.63 28 14C28 6.27 21.73 0 14 0z" fill="${color}" stroke="white" stroke-width="2"/><circle cx="14" cy="14" r="6" fill="white" opacity=".9"/></svg>`,iconSize:[size,h],iconAnchor:[size/2,h],popupAnchor:[0,-h],className:''});}
function mkCluster(color,n){return L.divIcon({html:`<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="20" fill="${color}" stroke="white" stroke-width="2.5" opacity=".92"/><text x="22" y="27" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="${n>9?12:14}" font-weight="800" fill="white">${n}</text></svg>`,iconSize:[44,44],iconAnchor:[22,22],popupAnchor:[0,-22],className:''});}

function buildMapLegend(rows){
  const ESTADOS=[{key:'Pdte. presupuesto',color:'#f4a261'},{key:'Pdte. aprobación',color:'#457b9d'},{key:'Aprobado',color:'#2d6a4f'},{key:'Facturado',color:'#6d597a'},{key:'No procede',color:'#e63946'},{key:'Sin estado',color:'#6b7a74'}];
  const counts={};rows.forEach(r=>{counts[r.estado]=(counts[r.estado]||0)+1;});
  const el=document.getElementById('mapLegend');if(!el)return;
  el.innerHTML=ESTADOS.map(e=>`<label style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 8px;border-radius:8px" onmouseover="this.style.background='var(--green-bg)'" onmouseout="this.style.background='transparent'">
    <input type="checkbox" ${activeEstados.has(e.key)?'checked':''} data-estado="${e.key}" style="accent-color:${e.color};width:13px;height:13px;cursor:pointer">
    <span class="legend-pin" style="background:${e.color}"></span>

  el.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.addEventListener('change',()=>{if(cb.checked)activeEstados.add(cb.dataset.estado);else activeEstados.delete(cb.dataset.estado);applyMapFilter();}));
}
function applyMapFilter(){
  if(!leafletMap)return;
  Object.values(munMarkers).forEach(m=>m.remove());munMarkers={};
  const vis=filteredRows.filter(r=>activeEstados.has(r.estado));
  const byMun={};vis.forEach(r=>{if(!byMun[r.municipio])byMun[r.municipio]=[];byMun[r.municipio].push(r);});
  Object.entries(byMun).forEach(([mun,munRows])=>{
    const coords=munGeoCache[mun];if(!coords)return;
    const ec={};munRows.forEach(r=>{ec[r.estado]=(ec[r.estado]||0)+1;});
    const dom=Object.entries(ec).sort((a,b)=>b[1]-a[1])[0][0];
    const icon=munRows.length===1?mkPin(colorForEstado(dom)):mkCluster(colorForEstado(dom),munRows.length);
    const m=L.marker([coords.lat,coords.lng],{icon}).addTo(leafletMap);
    m.bindPopup(L.popup({maxWidth:300}).setContent(popupMun(mun,munRows)));
    munMarkers[mun]=m;
  });
  Object.entries(dirMarkers).forEach(([exp,marker])=>{const row=filteredRows.find(r=>r.exp===exp);if(row&&activeEstados.has(row.estado)){if(!leafletMap.hasLayer(marker))marker.addTo(leafletMap);}else if(leafletMap.hasLayer(marker))marker.remove();});
  const list=document.getElementById('mapIncList');
  if(list)list.querySelectorAll('.map-inc-item').forEach(item=>{const row=filteredRows.find(r=>r.exp===item.dataset.exp);item.style.display=(row&&activeEstados.has(row.estado))?'block':'none';});
}
window.selectAllEstados=val=>{activeEstados=new Set(val?['Pdte. presupuesto','Pdte. aprobación','Aprobado','Facturado','No procede','Sin estado']:[]);document.querySelectorAll('#mapLegend input[type=checkbox]').forEach(cb=>{cb.checked=val;});applyMapFilter();};
function popupMun(mun,rows){return`<div style="font-family:-apple-system,sans-serif;min-width:230px;max-width:290px"><div style="font-size:13px;font-weight:700;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #e4ebe7">${mun} <span style="font-size:11px;color:#6b7a74">${rows.length} incidencia${rows.length>1?'s':''}</span></div><div style="max-height:260px;overflow-y:auto">${rows.map(r=>`<div onclick="window._openFichaExp('${r.exp}')" style="padding:7px 8px;border-radius:8px;cursor:pointer;margin-bottom:4px;background:#f4f6f5;border:1px solid #e4ebe7" onmouseover="this.style.background='#d8f3dc'" onmouseout="this.style.background='#f4f6f5'"><div style="font-size:12px;font-weight:700;color:#2d6a4f">${r.exp}</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:3px"><span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:${colorForEstado(r.estado)}20;color:${colorForEstado(r.estado)}">${r.estado}</span>${r.base>0?`<span style="font-size:10px;color:#6b7a74">${euro2(r.base)}</span>`:''}</div></div>`).join('')}</div></div>`;}
function renderNoUbicadas(sinDir,noGeo){const todas=[...new Map([...sinDir,...noGeo].map(r=>[r.exp,r])).values()];const el=document.getElementById('mapNoUbicadas');if(!el)return;if(!todas.length){el.style.display='none';return;}el.style.display='block';el.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;cursor:pointer" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'"><div style="display:flex;align-items:center;gap:6px"><span>⚠️</span><span style="font-size:12px;font-weight:700;color:var(--warning)">Sin ubicar</span><span style="background:var(--warning-light);color:#c07a30;padding:1px 7px;border-radius:20px;font-size:11px;font-weight:700">${todas.length}</span></div><span style="font-size:11px;color:var(--text-ter)">▼</span></div><div style="display:none">${todas.map(r=>`<div onclick="window._openFichaExp('${r.exp}')" style="padding:7px 8px;border-radius:8px;cursor:pointer;margin-bottom:4px;background:#fff;border:1px solid #fde68a"><div style="font-size:12px;font-weight:700;color:var(--green)">${r.exp}</div><div style="font-size:11px;color:var(--text-sec)">${r.municipio}</div><div style="font-size:10px;color:#c07a30;margin-top:2px;font-weight:600">${!r.fullAddr||r.fullAddr.replace(/,/g,'').replace(/España/i,'').trim().length<=5?'⚠ Sin dirección':'⚠ Dirección no encontrada'}</div></div>`).join('')}</div>`;}

async function renderMap(){
  const rows=filteredRows;
  if(!leafletMap){leafletMap=L.map('map',{zoomControl:true}).setView([37.9,-3.4],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',maxZoom:19}).addTo(leafletMap);}

  const sinDir=[],byMun={};rows.forEach(r=>{if(!r.fullAddr||r.fullAddr.replace(/,/g,'').replace(/España/i,'').trim().length<=5)sinDir.push(r);if(!byMun[r.municipio])byMun[r.municipio]=[];byMun[r.municipio].push(r);});
  const munList=Object.keys(byMun);

  if(munBounds.length)leafletMap.fitBounds(munBounds,{padding:[40,40],maxZoom:12});setTimeout(()=>leafletMap.invalidateSize(),100);
  const noGeo=[],toRefine=rows.filter(r=>!geoCache[r.geoKey]);

  document.getElementById('mapIncList').addEventListener('click',e=>{const item=e.target.closest('[data-exp]');if(!item)return;const row=filteredRows.find(r=>r.exp===item.dataset.exp);if(!row)return;const dm=dirMarkers[row.exp];if(dm){leafletMap.setView(dm.getLatLng(),16,{animate:true});dm.openPopup();return;}const mm=munMarkers[row.municipio];if(mm){leafletMap.setView(mm.getLatLng(),13,{animate:true});mm.openPopup();}else openFicha(row);});
}

/* ─── DASHBOARD RENDER ─── */
function renderDashboard(){
  destroyCharts();

  if(!rows.length){document.getElementById('content').innerHTML='<div class="placeholder"><strong>Sin resultados</strong>Prueba a cambiar los filtros</div>';return;}

  // ── AGREGADOS ──
  const estC={},obraC={},munC={},munBase={},tipoC={},tipoBase={};
  let sBase=0,sTotal=0,sPenalR=0,nPenalR=0,nPrior=0;
  const mesesSolicitud={},mesesEnviado={},mesesApr={},mesesFact={};
  let sumaDiasTram=0,nDiasTram=0,nEnPlazo=0,nTotal3d=0;

  const pen60Vencidas=rows.filter(r=>r.pen60==='vencida');
  const pen60Aviso=rows.filter(r=>r.pen60==='aviso');
  const pen60Plazo=rows.filter(r=>r.pen60==='plazo');
  const importePenalBase=pen60Vencidas.reduce((s,r)=>s+r.base,0);
  const importePenal10=importePenalBase*0.1;

  rows.forEach(r=>{
    estC[r.estado]=(estC[r.estado]||0)+1;
    if(r.obraLabel)obraC[r.obraLabel]=(obraC[r.obraLabel]||0)+1;
    if(r.municipio){munC[r.municipio]=(munC[r.municipio]||0)+1;munBase[r.municipio]=(munBase[r.municipio]||0)+r.base;}
    if(r.tipologia){tipoC[r.tipologia]=(tipoC[r.tipologia]||0)+1;tipoBase[r.tipologia]=(tipoBase[r.tipologia]||0)+r.base;}
    sBase+=r.base;sTotal+=r.total;
    if(r.penalReal>0){sPenalR+=r.penalReal;nPenalR++;}
    if(r.prior)nPrior++;
    if(r.diasTramitacion!==null){sumaDiasTram+=r.diasTramitacion;nDiasTram++;}
    // Para % cumplimiento plazo 3d
    if(!r.excluida&&r.fSol){nTotal3d++;if(r.p1Status==='cumplido'||r.p1Status==='ok'||r.p1Status==='warning')nEnPlazo++;}
    // Por mes
    const addMes=(obj,d)=>{if(d){const k=monthKey(d);obj[k]=(obj[k]||{n:0,base:0});obj[k].n++;obj[k].base+=r.base;}};
    addMes(mesesSolicitud,r.fSol);addMes(mesesEnviado,r.fEnv);addMes(mesesApr,r.fApr);addMes(mesesFact,r.fFact);
  });

  const facturadas=rows.filter(r=>r.esFacturada||r.obraLabel==='Facturado');
  const pendPpto=rows.filter(r=>r.estado==='Pdte. presupuesto');
  const pendApr=rows.filter(r=>r.estado==='Pdte. aprobación');
  const noProcede=rows.filter(r=>r.estado==='No procede');

/* ─── CARGA ─── */
async function loadData(){
  document.getElementById('statusText').textContent='Actualizando…';
  try{
    const res=await fetch(GIST_RAW+'?t='+Date.now());
    if(!res.ok)throw new Error('HTTP '+res.status);
    const json=await res.json();
    rawRows=processRows(Array.isArray(json)?json:(json.value||[]));
    filteredRows=[...rawRows];
    populateFiltros();
    const n=rawRows.length;
    const nb=document.getElementById('navMapBadge');if(nb)nb.textContent=n;
    const bnb=document.getElementById('bnMapBadge');if(bnb)bnb.textContent=n;
    if(currentTab==='dash')renderDashboard();else renderMap();
    document.getElementById('statusText').textContent='Act. '+new Date().toLocaleTimeString('es-ES');
  }catch(err){
    document.getElementById('statusText').textContent='Error: '+err.message;
    document.getElementById('content').innerHTML='<div class="placeholder"><strong>Sin conexión</strong>Verifica que Power Automate ha publicado el JSON en el Gist</div>';
  }
}

/* ─── NAV ─── */
function switchTab(tab){
  currentTab=tab;
  document.getElementById('navDash').classList.toggle('active',tab==='dash');
  document.getElementById('navMap').classList.toggle('active',tab==='map');
  document.getElementById('dashTab').style.display=tab==='dash'?'block':'none';
  document.getElementById('dashTab-filters').style.display=tab==='dash'?'block':'none';
  document.getElementById('mapTab').style.display=tab==='map'?'block':'none';
  if(tab==='map')renderMap();
}
