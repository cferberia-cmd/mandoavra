<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVRA Jaén · Control de Incidencias</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg:#f8f8f6;--surface:#fff;--surface-2:#f2f2ef;--border:#e8e8e4;
  --text:#18181b;--text-sec:#71717a;--text-ter:#a1a1aa;
  --accent:#4f46e5;--accent-light:#eef2ff;--accent-mid:#818cf8;
  --success:#059669;--success-light:#ecfdf5;
  --warning:#d97706;--warning-light:#fffbeb;
  --danger:#dc2626;--danger-light:#fef2f2;
  --purple:#7c3aed;--purple-light:#f5f3ff;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.07),0 1px 4px rgba(0,0,0,.04);
  --r:14px;--r-sm:8px;--r-xs:5px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:14px;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;min-height:100vh;}
.shell{max-width:1320px;margin:0 auto;padding:28px 24px 48px;}

/* HEADER */
.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;gap:16px;flex-wrap:wrap;}
.header-eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
.header-title{font-size:22px;font-weight:700;letter-spacing:-.02em;}
.header-sub{font-size:12px;color:var(--text-sec);margin-top:4px;display:flex;align-items:center;gap:6px;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px rgba(5,150,105,.15);}
.header-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r-sm);font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;box-shadow:var(--shadow-sm);transition:all .15s;}
.btn:hover{background:var(--surface-2);border-color:#d4d4d0;}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-primary:hover{background:#4338ca;border-color:#4338ca;}

/* MAIN TABS */
.main-tabs{display:flex;gap:0;margin-bottom:20px;border-bottom:2px solid var(--border);}
.main-tab{padding:10px 22px;font-size:13px;font-weight:500;cursor:pointer;color:var(--text-sec);border:none;background:none;font-family:inherit;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;display:flex;align-items:center;gap:7px;}
.main-tab:hover{color:var(--text);}
.main-tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}

/* FILTER BAR */
.filter-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 20px;margin-bottom:24px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;box-shadow:var(--shadow-sm);}
.fg{display:flex;flex-direction:column;gap:5px;}
.fg label{font-size:11px;font-weight:600;color:var(--text-sec);letter-spacing:.04em;text-transform:uppercase;}
.fg select,.fg input{border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 11px;font-size:12px;color:var(--text);background:var(--surface-2);font-family:inherit;outline:none;transition:border-color .15s;min-width:150px;}
.fg select:focus,.fg input:focus{border-color:var(--accent);background:#fff;}

/* KPI CARDS */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px;}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px 20px 16px;box-shadow:var(--shadow-sm);cursor:pointer;transition:box-shadow .2s,transform .15s,border-color .15s;position:relative;overflow:hidden;}
.kpi-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);border-color:#d4d4d0;}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r) var(--r) 0 0;}
.kpi-card.accent::before{background:var(--accent);}
.kpi-card.success::before{background:var(--success);}
.kpi-card.warning::before{background:var(--warning);}
.kpi-card.danger::before{background:var(--danger);}
.kpi-card.purple::before{background:var(--purple);}
.kpi-card.neutral::before{background:var(--text-ter);}
.kpi-label{font-size:11px;font-weight:600;color:var(--text-sec);letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px;}
.kpi-value{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-bottom:8px;}
.kpi-card.accent .kpi-value{color:var(--accent);}
.kpi-card.success .kpi-value{color:var(--success);}
.kpi-card.warning .kpi-value{color:var(--warning);}
.kpi-card.danger .kpi-value{color:var(--danger);}
.kpi-card.purple .kpi-value{color:var(--purple);}
.kpi-sub{font-size:11px;color:var(--text-ter);line-height:1.5;}
.kpi-sub .mes{display:block;color:var(--text-sec);font-weight:500;}
.kpi-sparkline{margin-top:12px;height:36px;}

/* ALERT BANNER */
.alert-banner{background:linear-gradient(135deg,#fef2f2 0%,#fff5f5 100%);border:1px solid #fecaca;border-radius:var(--r);padding:20px 24px;margin-bottom:24px;display:flex;flex-wrap:wrap;gap:28px;align-items:center;}
.alert-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--danger);margin-bottom:6px;}
.alert-amount{font-size:32px;font-weight:800;color:var(--danger);letter-spacing:-.03em;cursor:pointer;}
.alert-sub{font-size:11px;color:#b91c1c;margin-top:4px;}
.alert-stats{display:flex;gap:24px;flex-wrap:wrap;}
.alert-stat-label{font-size:11px;font-weight:600;color:var(--text-sec);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px;}
.alert-stat-val{font-size:22px;font-weight:700;letter-spacing:-.02em;cursor:pointer;}

/* CHARTS */
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
@media(max-width:900px){.charts-row{grid-template-columns:1fr;}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;box-shadow:var(--shadow-sm);margin-bottom:16px;}
.card-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;}
.card-title{font-size:13px;font-weight:600;}
.card-subtitle{font-size:11px;color:var(--text-ter);}
.chart-wrap{position:relative;}
.chart-wrap.h180{height:180px;}
.chart-wrap.h280{height:280px;}
.donut-legend{display:flex;flex-direction:column;gap:7px;margin-top:14px;}
.dl-item{display:flex;align-items:center;justify-content:space-between;font-size:11px;}
.dl-left{display:flex;align-items:center;gap:7px;color:var(--text-sec);}
.dl-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.dl-pct{font-weight:600;color:var(--text);}

/* TABS */
.tabs{display:flex;gap:4px;margin-bottom:14px;background:var(--surface-2);border-radius:var(--r-sm);padding:4px;width:fit-content;}
.tab{padding:6px 14px;border-radius:var(--r-xs);font-size:12px;font-weight:500;cursor:pointer;color:var(--text-sec);transition:all .15s;border:none;background:transparent;font-family:inherit;}
.tab.active{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--shadow-sm);}

/* TABLE */
.tbl-wrap{overflow-x:auto;border-radius:var(--r-sm);}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-ter);padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface);}
tbody td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:var(--surface-2);}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap;}
.badge.ok{background:var(--success-light);color:var(--success);}
.badge.warn{background:var(--warning-light);color:var(--warning);}
.badge.danger{background:var(--danger-light);color:var(--danger);}
.badge.neutral{background:var(--surface-2);color:var(--text-sec);}
.badge.info{background:var(--accent-light);color:var(--accent);}
.exp-link{color:var(--accent);font-weight:600;cursor:pointer;}
.exp-link:hover{text-decoration:underline;}

/* MAP TAB */
#mapTab{display:none;}
.map-shell{display:grid;grid-template-columns:300px 1fr;gap:16px;height:calc(100vh - 280px);min-height:500px;}
@media(max-width:800px){.map-shell{grid-template-columns:1fr;height:auto;}}
.map-sidebar{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;overflow-y:auto;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:12px;}
.map-sidebar-title{font-size:12px;font-weight:700;color:var(--text-sec);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px;}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-sec);}
.legend-pin{width:14px;height:14px;border-radius:50%;flex-shrink:0;border:2px solid rgba(0,0,0,.2);}
.geo-progress{font-size:11px;color:var(--text-sec);background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;}
.geo-bar-wrap{background:#e8e8e4;border-radius:20px;height:5px;margin-top:6px;overflow:hidden;}
.geo-bar{height:5px;border-radius:20px;background:var(--accent);transition:width .3s;}
.map-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.map-stat{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;text-align:center;}
.map-stat-val{font-size:18px;font-weight:800;color:var(--accent);}
.map-stat-label{font-size:10px;color:var(--text-ter);margin-top:2px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;}
.map-inc-list{flex:1;overflow-y:auto;}
.map-inc-item{padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;transition:background .12s;border:1px solid transparent;margin-bottom:4px;}
.map-inc-item:hover{background:var(--surface-2);border-color:var(--border);}
.map-inc-exp{font-size:12px;font-weight:700;color:var(--accent);}
.map-inc-mun{font-size:11px;color:var(--text-sec);margin-top:1px;}
.map-inc-status{margin-top:4px;}
#map{border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--shadow-sm);}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(24,24,27,.5);backdrop-filter:blur(4px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;}
.modal{background:var(--surface);border-radius:var(--r);width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.18);}
.modal.sm{max-width:820px;}
.modal.lg{max-width:1140px;}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--border);flex-shrink:0;}
.modal-hdr h2{font-size:15px;font-weight:700;}
.modal-hdr-actions{display:flex;gap:8px;}
.modal-body{overflow:auto;padding:24px;flex:1;}
.modal-close{background:none;border:none;cursor:pointer;color:var(--text-sec);font-size:18px;padding:4px 8px;border-radius:var(--r-xs);font-family:inherit;}
.modal-close:hover{background:var(--surface-2);}
.ficha-section{margin-bottom:24px;}
.ficha-section-title{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-ter);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.ficha-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;}
.ficha-field .fl{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-ter);margin-bottom:4px;}
.ficha-field .fv{font-size:13px;font-weight:500;}
.recl{background:var(--surface-2);border-radius:var(--r-sm);padding:14px 16px;font-size:12px;line-height:1.6;color:var(--text-sec);white-space:pre-wrap;border-left:3px solid var(--accent);}
.placeholder{text-align:center;padding:48px 24px;color:var(--text-ter);font-size:13px;}
.placeholder strong{display:block;font-size:15px;color:var(--text-sec);margin-bottom:6px;}
</style>
</head>
<body>
<div class="shell">

  <!-- HEADER -->
  <div class="header">
    <div>
      <div class="header-eyebrow">Serveo · Contrato AVRA</div>
      <h1 class="header-title">Control de Incidencias — Jaén</h1>
      <div class="header-sub">
        <span class="live-dot"></span>
        <span id="statusText">Cargando datos en vivo…</span>
      </div>
    </div>
    <div class="header-right">
      <button class="btn" id="refreshBtn">&#8635; Actualizar</button>
    </div>
  </div>

  <!-- MAIN TABS -->
  <div class="main-tabs">
    <button class="main-tab active" id="tabDashBtn">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
    </button>
    <button class="main-tab" id="tabMapBtn">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
      Mapa de incidencias
    </button>
  </div>

  <!-- FILTER BAR (shared) -->
  <div class="filter-bar">
    <div class="fg"><label>Filtrar por fecha</label>
      <select id="filtroTipoFecha">
        <option value="peticion">F. Petición presupuesto</option>
        <option value="aprobacion">F. Aprobación AVRA</option>
        <option value="conformidad">F. Conformidad</option>
        <option value="facturado">F. Facturado</option>
      </select>
    </div>
    <div class="fg"><label>Mes / Año</label><select id="filtroMes"><option value="">— Todos —</option></select></div>
    <div class="fg"><label>Rango desde</label><input type="date" id="filtroDesde"></div>
    <div class="fg"><label>Hasta</label><input type="date" id="filtroHasta"></div>
    <div class="fg"><label>Municipio</label><select id="filtroMunicipio"><option value="">— Todos —</option></select></div>
    <div class="fg"><label>Estado</label><select id="filtroEstado"><option value="">— Todos —</option></select></div>
    <div style="display:flex;gap:8px;align-items:flex-end;">
      <button class="btn btn-primary" id="btnAplicar">Aplicar</button>
      <button class="btn" id="btnLimpiar">Limpiar</button>
    </div>
  </div>

  <!-- TAB 1: DASHBOARD -->
  <div id="dashTab">
    <div id="content"><div class="placeholder"><strong>Conectando…</strong>Cargando datos del Gist de GitHub</div></div>
  </div>

  <!-- TAB 2: MAPA -->
  <div id="mapTab">
    <div class="map-shell">
      <div class="map-sidebar">
        <div>
          <div class="map-sidebar-title">Leyenda de estado</div>
          <div id="mapLegend" style="display:flex;flex-direction:column;gap:5px;margin-bottom:12px;"></div>
        </div>
        <div id="geoProgress" style="display:none;" class="geo-progress">
          <div id="geoText">Geocodificando…</div>
          <div class="geo-bar-wrap"><div class="geo-bar" id="geoBar" style="width:0%"></div></div>
        </div>
        <div class="map-stats" id="mapStats"></div>
        <div class="map-sidebar-title" style="margin-top:4px;">Incidencias en el mapa</div>
        <div class="map-inc-list" id="mapIncList"><div class="placeholder" style="padding:20px 0">Cargando…</div></div>
      </div>
      <div id="map"></div>
    </div>
  </div>

</div>

<!-- FICHA MODAL -->
<div class="overlay" id="fichaOverlay" style="display:none;">
  <div class="modal sm">
    <div class="modal-hdr">
      <h2 id="fichaTitle">Ficha de expediente</h2>
      <button class="modal-close" id="fichaClose">✕</button>
    </div>
    <div class="modal-body" id="fichaBody"></div>
  </div>
</div>

<!-- LISTADO MODAL -->
<div class="overlay" id="modalOverlay" style="display:none;">
  <div class="modal lg">
    <div class="modal-hdr">
      <h2 id="modalTitle">Incidencias</h2>
      <div class="modal-hdr-actions">
        <button class="btn" id="btnDescargaExcel">⬇ Excel</button>
        <button class="btn" id="btnDescargaPDF">⬇ PDF</button>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
const GIST_RAW = "https://gist.githubusercontent.com/cferberia-cmd/428e16516bae61ac35c15be1c8b6fd8f/raw/incidencias.json";
const REFRESH_MS = 5 * 60 * 1000;
const GEO_CACHE_KEY = 'avra_geo_cache_v2';
let charts = [], rawRows = [], filteredRows = [], modalRows = [], modalTitleText = '';
let KEYS = {}, leafletMap = null, markers = [], currentTab = 'dash';
let geoCache = {};
try { geoCache = JSON.parse(localStorage.getItem(GEO_CACHE_KEY)||'{}'); } catch(e) { geoCache = {}; }

/* ─── UTILS ─── */
const norm = s => s ? String(s).trim().toUpperCase().replace(/[\s\n]+/g,' ') : '';
function findKey(row, cands) { const k = Object.keys(row); for (const c of cands) { const f = k.find(k=>norm(k).includes(c)); if(f) return f; } return null; }
function parseNum(v) { if(!v&&v!==0) return 0; if(typeof v==='number') return v; const n=parseFloat(String(v).replace(/[^\d,.-]/g,'').replace(/\.(?=\d{3})/g,'').replace(',','.')); return isNaN(n)?0:n; }
function excelDate(v) {
  if(!v&&v!==0) return null;
  if(typeof v==='string'){
    const s=v.trim();
    if(norm(s).includes('NO PROCEDE')||norm(s).includes('PROCEDE')) return null;
    if(s.includes('/')){const p=s.split('/');if(p.length===3){const d=new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));return isNaN(d.getTime())?null:d;}}
    if(s.includes('-')){const d=new Date(s);return isNaN(d.getTime())?null:d;}
  }
  const n=typeof v==='number'?v:parseFloat(v);
  if(isNaN(n)||n<1) return null;
  return new Date(Math.round((n-25569)*86400*1000));
}
const fmtDate = v => { const d=excelDate(v); return d?d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'}):'—'; };
const monthKey = d => d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`:null;
const monthLabel = k => { if(!k)return''; const[y,m]=k.split('-'); return `${['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'][parseInt(m)-1]} ${y}`; };
function addDiasLab(d,n){let cur=new Date(d),a=0;while(a<n){cur.setDate(cur.getDate()+1);if(cur.getDay()!==0&&cur.getDay()!==6)a++;}return cur;}
function diasLabRestantes(d1,d2){if(!d1||!d2)return 0;let c=0,cur=new Date(d1);const e=new Date(d2);while(cur<e){cur.setDate(cur.getDate()+1);if(cur.getDay()!==0&&cur.getDay()!==6)c++;}return c;}
const add2M = d => { const r=new Date(d);r.setMonth(r.getMonth()+2);return r; };
function normEstado(s){s=norm(s);if(s.includes('NO PROCEDE'))return'No procede';if(s.includes('PENDIENTE PRESUPUESTO'))return'Pdte. presupuesto';if(s.includes('PENDIENTE APROBACION')||s.includes('PENDIENTE APROBACIÓN'))return'Pdte. aprobación';if(s.includes('PRESUPUESTO APROBADO'))return'Aprobado';return s||'Sin estado';}
function normObra(s){s=norm(s);if(s.includes('FACTURADO'))return'Facturado';if(s.includes('EN EJECUCION')||s.includes('EN EJECUCIÓN'))return'En ejecución';if(s.includes('EJECUTADO'))return'Ejecutado';return s||'';}
function normProv(s){s=norm(s);if(s.includes('CEION')&&s.includes('ALGUACIL'))return'CEION-Adán Alguacil';if(s.includes('CEION'))return'CEION';if(s.includes('SERVEO'))return'SERVEO';return s||'Sin asignar';}
const euro2 = v => '€ '+v.toLocaleString('es-ES',{minimumFractionDigits:2});
const euro = v => '€ '+Math.round(v).toLocaleString('es-ES');
function alertBadge(s,d){
  if(s==='excluida')return`<span class="badge neutral">Excluida</span>`;
  if(s==='cumplido')return`<span class="badge ok">✓ OK</span>`;
  if(s==='vencido') return`<span class="badge danger">⚠ Vencido</span>`;
  if(s==='warning') return`<span class="badge warn">⏱ ${d}d</span>`;
  if(s==='ok')      return`<span class="badge ok">✓ ${d}d</span>`;
  return`<span class="badge neutral">—</span>`;
}

/* ─── PROCESS ROWS ─── */
function processRows(rows){
  if(!rows.length)return[];
  const s=rows[0];
  KEYS={
    exp:findKey(s,['NUMERO DE EXPEDIENTE','EXPEDIENTE']),
    titular:findKey(s,['TITULAR O REPRESENTANTE','TITULAR']),
    telefono:findKey(s,['TELÉFONO','TELEFONO']),
    tipoVia:findKey(s,['TIPO VÍA','TIPO VIA']),
    direccion:findKey(s,['DIRECCIÓN','DIRECCION']),
    numero:findKey(s,['Nº']),
    bloque:findKey(s,['BLOQUE']),
    piso:findKey(s,['PISO']),
    puerta:findKey(s,['PUERTA']),
    provincia:findKey(s,['PROVINCIA']),
    reclamacion:findKey(s,['CONTENIDO RECLAMACIÓN','CONTENIDO RECLAMACION']),
    est:findKey(s,['ESTADO SERVEO','ESTADO']),
    prov:findKey(s,['PROVEEDOR']),
    mun:findKey(s,['MUNICIPIO']),
    base:findKey(s,['BASE PRESUPUESTO SERVEO']),
    total:findKey(s,['TOTAL']),
    obra:findKey(s,['ESTADO OBRA']),
    fPet:findKey(s,['FECHA DE PETICION DE PRESUPUESTO','FECHA PETICION']),
    fPres:findKey(s,['FECHA PRESUPUESTO']),
    fApr:findKey(s,['FECHA APROBACION AVRA','APROBADO POR AVRA']),
    fCon:findKey(s,['FECHA CONFORMIDAD']),
    fFact:findKey(s,['FACTURADO']),
    penal:findKey(s,['PENALIZACION','PENALIZACIÓN']),
    prior:findKey(s,['PRIORITARIO'])
  };
  const hoy=new Date();hoy.setHours(0,0,0,0);
  return rows.map(r=>{
    const estado=normEstado(KEYS.est?r[KEYS.est]:null);
    const obraLabel=normObra(KEYS.obra?r[KEYS.obra]:'');
    const base=parseNum(KEYS.base?r[KEYS.base]:0);
    const total=parseNum(KEYS.total?r[KEYS.total]:0);
    const penalReal=parseNum(KEYS.penal?r[KEYS.penal]:0);
    const fPet=excelDate(KEYS.fPet?r[KEYS.fPet]:null);
    const fPres=excelDate(KEYS.fPres?r[KEYS.fPres]:null);
    const fApr=excelDate(KEYS.fApr?r[KEYS.fApr]:null);
    const fCon=excelDate(KEYS.fCon?r[KEYS.fCon]:null);
    const fFact=excelDate(KEYS.fFact?r[KEYS.fFact]:null);
    const esFacturada=fFact!==null;
    const excluida=(obraLabel==='Facturado'||estado==='No procede'||esFacturada);
    let p1Status='sin-fecha',p1Dias=null,p2Status='sin-fecha',p2Dias=null,penalEst=0;
    if(!excluida){
      if(fPet){const lim1=addDiasLab(fPet,3);if(fPres){p1Status=fPres<=lim1?'cumplido':'vencido';if(p1Status==='vencido')penalEst+=base*.1;}else{const dr=diasLabRestantes(hoy,lim1);if(hoy>lim1){p1Status='vencido';penalEst+=base*.1;}else if(dr<=3){p1Status='warning';p1Dias=dr;}else{p1Status='ok';p1Dias=dr;}}}
      if(fApr){const lim2=add2M(fApr);if(obraLabel==='Ejecutado'||obraLabel==='Facturado'){p2Status='cumplido';}else{const dr=diasLabRestantes(hoy,lim2);if(hoy>lim2){p2Status='vencido';penalEst+=base*.1;}else if(dr<=3){p2Status='warning';p2Dias=dr;}else{p2Status='ok';p2Dias=dr;}}}
    }else{p1Status='excluida';p2Status='excluida';}
    // Dirección para geocodificación
    const tv=KEYS.tipoVia?norm(r[KEYS.tipoVia]):'';
    const di=KEYS.direccion?String(r[KEYS.direccion]||'').trim():'';
    const nu=KEYS.numero?String(r[KEYS.numero]||'').trim():'';
    const mu=KEYS.mun?String(r[KEYS.mun]||'').trim():'';
    const pr=KEYS.provincia?String(r[KEYS.provincia]||'').trim():'Jaén';
    const fullAddr=[tv,di,nu,mu,pr,'España'].filter(Boolean).join(', ');
    return{raw:r,exp:r[KEYS.exp]||'—',municipio:mu,estado,obraLabel,prov:normProv(KEYS.prov?r[KEYS.prov]:null),base,total,penalReal,penalEst,excluida,esFacturada,fPet,fPres,fApr,fCon,fFact,p1Status,p1Dias,p2Status,p2Dias,prior:!!(KEYS.prior&&r[KEYS.prior]&&norm(r[KEYS.prior])!==''),fullAddr,geoKey:fullAddr.toLowerCase()};
  });
}

function getDateForField(row,campo){if(campo==='peticion')return row.fPet;if(campo==='aprobacion')return row.fApr;if(campo==='conformidad')return row.fCon;if(campo==='facturado')return row.fFact;return null;}
function applyFilters(){
  const campo=document.getElementById('filtroTipoFecha').value;
  const mes=document.getElementById('filtroMes').value;
  const dv=document.getElementById('filtroDesde').value,hv=document.getElementById('filtroHasta').value;
  const desde=dv?new Date(dv):null,hasta=hv?new Date(hv):null;
  const mun=document.getElementById('filtroMunicipio').value,est=document.getElementById('filtroEstado').value;
  filteredRows=rawRows.filter(r=>{
    const fd=getDateForField(r,campo);
    if(mes){const mk=fd?monthKey(fd):null;if(mk!==mes)return false;}
    if(desde&&(!fd||fd<desde))return false;
    if(hasta){const h=new Date(hasta);h.setHours(23,59,59);if(!fd||fd>h)return false;}
    if(mun&&r.municipio!==mun)return false;
    if(est&&r.estado!==est)return false;
    return true;
  });
  if(currentTab==='dash') renderDashboard();
  else renderMap();
}
function limpiarFiltros(){
  ['filtroMes','filtroMunicipio','filtroEstado'].forEach(id=>document.getElementById(id).value='');

  filteredRows=[...rawRows];
  if(currentTab==='dash') renderDashboard();
  else renderMap();
}
function populateFiltros(){
  const campo=document.getElementById('filtroTipoFecha').value;
  const meses=new Set(),municipios=new Set(),estados=new Set();
  rawRows.forEach(r=>{const fd=getDateForField(r,campo);const mk=monthKey(fd);if(mk)meses.add(mk);if(r.municipio&&r.municipio!=='—')municipios.add(r.municipio);if(r.estado)estados.add(r.estado);});

  pop('filtroMes',meses,document.getElementById('filtroMes').value);

}

/* ─── GEOCODIFICACIÓN ─── */
const munGeoCache = {};
async function geocodeMunicipio(municipio, intentos=3){
  if(munGeoCache[municipio]) return munGeoCache[municipio];
  for(let i=0;i<intentos;i++){
    try{
      const q=encodeURIComponent(`${municipio}, Jaén, España`);
      const res=await fetch(`https://nominatim.openstreetmap.org/search?q=${q}&format=json&limit=1&countrycodes=es`,{headers:{'Accept-Language':'es','User-Agent':'AVRAJaenDashboard/1.0'}});
      if(!res.ok){await sleep(2000*(i+1));continue;}
      const d=await res.json();
      if(d&&d[0]){const c={lat:parseFloat(d[0].lat),lng:parseFloat(d[0].lon)};munGeoCache[municipio]=c;return c;}
    }catch(e){await sleep(2000*(i+1));}
  }
  return null;
}

async function geocodeDireccion(row){
  if(geoCache[row.geoKey]) return geoCache[row.geoKey];
  try{
    const q=encodeURIComponent(row.fullAddr);
    const res=await fetch(`https://nominatim.openstreetmap.org/search?q=${q}&format=json&limit=1&countrycodes=es`,{headers:{'Accept-Language':'es','User-Agent':'AVRAJaenDashboard/1.0'}});
    const d=await res.json();
    if(d&&d[0]){
      const c={lat:parseFloat(d[0].lat),lng:parseFloat(d[0].lon)};
      geoCache[row.geoKey]=c;
      localStorage.setItem(GEO_CACHE_KEY,JSON.stringify(geoCache));
      return c;
    }
  }catch(e){}
  return null;
}

/* ─── MAPA ─── */
let munMarkers={}, dirMarkers={}, geoRunning=false;
let activeEstados=new Set(Object.keys(ESTADO_COLOR).concat(['Sin estado']));

async function renderMap(){
  const rows=filteredRows;
  if(!leafletMap){
    leafletMap=L.map('map',{zoomControl:true}).setView([37.9,-3.4],10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',maxZoom:19}).addTo(leafletMap);
  }

  // Limpiar todo
  markers.forEach(m=>m.remove()); markers=[];
  Object.values(munMarkers).forEach(m=>m.remove()); munMarkers={};
  Object.values(dirMarkers).forEach(m=>m.remove()); dirMarkers={};

  // Leyenda con checkboxes
  buildMapLegend(rows);

  // Sidebar stats
  document.getElementById('mapStats').innerHTML=`
    <div class="map-stat"><div class="map-stat-val">${rows.length}</div><div class="map-stat-label">Total</div></div>
    <div class="map-stat"><div class="map-stat-val" style="color:var(--danger)">${rows.filter(r=>r.p1Status==='vencido'||r.p2Status==='vencido').length}</div><div class="map-stat-label">Vencidas</div></div>
    <div class="map-stat"><div class="map-stat-val" style="color:var(--success)">${rows.filter(r=>r.estado==='Aprobado').length}</div><div class="map-stat-label">Aprobadas</div></div>
    <div class="map-stat"><div class="map-stat-val" style="color:var(--warning)">${rows.filter(r=>r.estado==='Pdte. presupuesto').length}</div><div class="map-stat-label">Pdte.ppto.</div></div>`;

  // Sidebar lista
  document.getElementById('mapIncList').innerHTML=rows.map(r=>`
    <div class="map-inc-item" data-exp="${r.exp}">
      <div class="map-inc-exp">${r.exp}</div>
      <div class="map-inc-mun">${r.municipio}</div>
      <div class="map-inc-status"><span class="badge" style="background:${colorForEstado(r.estado)}20;color:${colorForEstado(r.estado)}">${r.estado}</span></div>
    </div>`).join('');

  // ── FASE 1: pins por municipio (instantáneo) ──
  const byMun={};
  rows.forEach(r=>{if(!byMun[r.municipio])byMun[r.municipio]=[];byMun[r.municipio].push(r);});
  const munList=Object.keys(byMun);
  const munBounds=[];

  const progEl=document.getElementById('geoProgress');
  const progText=document.getElementById('geoText');
  const progBar=document.getElementById('geoBar');
  progEl.style.display='block';
  progText.textContent=`Cargando municipios (${munList.length})…`;
  progBar.style.width='0%';

  for(let i=0;i<munList.length;i++){
    const mun=munList[i];
    const munRows=byMun[mun];
    const coords=await geocodeMunicipio(mun);
    if(!coords){await sleep(1100);continue;}
    munBounds.push([coords.lat,coords.lng]);
    // Color del estado más frecuente
    const estCount={};munRows.forEach(r=>{estCount[r.estado]=(estCount[r.estado]||0)+1;});
    const dominante=Object.entries(estCount).sort((a,b)=>b[1]-a[1])[0][0];
    const color=colorForEstado(dominante);
    const icon=munRows.length===1?makeMarkerIcon(color):makeClusterIcon(color,munRows.length);
    const m=L.marker([coords.lat,coords.lng],{icon}).addTo(leafletMap);
    m.bindPopup(L.popup({maxWidth:300}).setContent(popupContentMunicipio(mun,munRows)));
    munMarkers[mun]=m;
    markers.push(m);
    const pct=Math.round((i+1)/munList.length*100);
    progText.textContent=`Municipios: ${i+1}/${munList.length}`;
    progBar.style.width=pct+'%';
    if(!munGeoCache[mun])await sleep(1100);
  }

  if(munBounds.length) leafletMap.fitBounds(munBounds,{padding:[40,40],maxZoom:12});
  setTimeout(()=>leafletMap.invalidateSize(),100);

  // ── FASE 2: refinar con dirección exacta (en segundo plano) ──
  const toRefine=rows.filter(r=>!geoCache[r.geoKey]);
  if(!toRefine.length){progEl.style.display='none';return;}

  progText.textContent=`Precisando direcciones: 0/${toRefine.length}…`;
  progBar.style.width='0%';

  for(let i=0;i<toRefine.length;i++){
    if(currentTab!=='map')break; // parar si cambian de pestaña
    const row=toRefine[i];
    const coords=await geocodeDireccion(row);
    await sleep(1100);
    if(!coords)continue;
    // Reemplazar el pin de municipio por pin individual si solo queda 1 en ese municipio
    const color=colorForEstado(row.estado);
    const dm=L.marker([coords.lat,coords.lng],{icon:makeMarkerIcon(color,24)}).addTo(leafletMap);
    dm.bindPopup(L.popup({maxWidth:280}).setContent(popupContentDireccion(row)));
    dirMarkers[row.exp]=dm;
    markers.push(dm);
    const pct=Math.round((i+1)/toRefine.length*100);
    progText.textContent=`Precisando: ${i+1}/${toRefine.length}`;
    progBar.style.width=pct+'%';
  }
  progEl.style.display='none';

  // Sidebar click → volar al marker
  document.getElementById('mapIncList').addEventListener('click',e=>{
    const item=e.target.closest('[data-exp]');if(!item)return;
    const exp=item.dataset.exp;
    const row=filteredRows.find(r=>r.exp===exp);if(!row)return;
    // Preferir pin de dirección exacta, si no el de municipio
    const dm=dirMarkers[exp];
    if(dm){leafletMap.setView(dm.getLatLng(),16,{animate:true});dm.openPopup();return;}
    const mm=munMarkers[row.municipio];
    if(mm){leafletMap.setView(mm.getLatLng(),13,{animate:true});mm.openPopup();}
    else openFicha(row);
  });
}

// Global para el popup del mapa
window._openFichaExp = (exp) => {
  const row = rawRows.find(r => r.exp === exp);
  if (row) openFicha(row);
};

/* ─── CARGA DATOS ─── */
async function loadData(){
  document.getElementById('statusText').textContent='Actualizando datos…';
  try{
    const res=await fetch(GIST_RAW+'?t='+Date.now());
    if(!res.ok)throw new Error('HTTP '+res.status);
    const json=await res.json();
    rawRows=processRows(Array.isArray(json)?json:(json.value||[]));
    filteredRows=[...rawRows];
    populateFiltros();
    if(currentTab==='dash') renderDashboard();
    else renderMap();
    document.getElementById('statusText').textContent='Actualizado: '+new Date().toLocaleString('es-ES');
  }catch(err){
    document.getElementById('statusText').textContent='Error: '+err.message;
    document.getElementById('content').innerHTML='<div class="placeholder"><strong>Sin conexión con los datos</strong>Verifica que Power Automate ha publicado el JSON en el Gist</div>';
  }
}

document.getElementById('tabDashBtn').addEventListener('click',()=>{
  currentTab='dash';
  document.getElementById('tabDashBtn').classList.add('active');
  document.getElementById('tabMapBtn').classList.remove('active');
  document.getElementById('dashTab').style.display='block';
  document.getElementById('mapTab').style.display='none';
});
document.getElementById('tabMapBtn').addEventListener('click',()=>{
  currentTab='map';
  document.getElementById('tabMapBtn').classList.add('active');
  document.getElementById('tabDashBtn').classList.remove('active');
  document.getElementById('dashTab').style.display='none';
  document.getElementById('mapTab').style.display='block';
  renderMap();
});

/* ─── EVENTOS ─── */
document.getElementById('refreshBtn').addEventListener('click',loadData);
document.getElementById('btnAplicar').addEventListener('click',applyFilters);
document.getElementById('btnLimpiar').addEventListener('click',limpiarFiltros);
document.getElementById('filtroTipoFecha').addEventListener('change',populateFiltros);
document.getElementById('filtroMes').addEventListener('change',()=>{if(document.getElementById('filtroMes').value){document.getElementById('filtroDesde').value='';document.getElementById('filtroHasta').value='';}});
document.getElementById('filtroDesde').addEventListener('change',()=>{if(document.getElementById('filtroDesde').value)document.getElementById('filtroMes').value='';});
document.getElementById('filtroHasta').addEventListener('change',()=>{if(document.getElementById('filtroHasta').value)document.getElementById('filtroMes').value='';});
document.getElementById('modalClose').addEventListener('click',()=>document.getElementById('modalOverlay').style.display='none');
document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('modalOverlay'))document.getElementById('modalOverlay').style.display='none';});
document.getElementById('fichaClose').addEventListener('click',()=>document.getElementById('fichaOverlay').style.display='none');
document.getElementById('fichaOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('fichaOverlay'))document.getElementById('fichaOverlay').style.display='none';});
document.getElementById('btnDescargaExcel').addEventListener('click',descargarExcel);
document.getElementById('btnDescargaPDF').addEventListener('click',descargarPDF);
document.getElementById('modalBody').addEventListener('click',e=>{const el=e.target.closest('.exp-link');if(!el)return;const row=rawRows.find(r=>r.exp===el.dataset.exp);if(row)openFicha(row);});

loadData();
setInterval(loadData,REFRESH_MS);
</script>
</body>
</html>
