<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVRA Jaén · Control de Incidencias</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --green-dark:#1a3c2e;--green:#2d6a4f;--green-mid:#40916c;--green-light:#74c69d;--green-xlight:#d8f3dc;--green-bg:#f0faf4;
  --sidebar-w:220px;--bg:#f4f6f5;--surface:#fff;--border:#e4ebe7;--text:#111827;--text-sec:#6b7a74;--text-ter:#a0aea8;
  --danger:#e63946;--danger-light:#fff0f0;--warning:#f4a261;--warning-light:#fff7ee;
  --info:#457b9d;--info-light:#eaf2f8;--purple:#6d597a;--purple-light:#f3f0f7;
  --shadow:0 2px 8px rgba(0,0,0,.07);--shadow-lg:0 8px 24px rgba(0,0,0,.10);
  --r:16px;--r-sm:10px;--r-xs:6px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;font-size:14px;background:var(--bg);color:var(--text);}
.app{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:var(--sidebar-w);background:var(--green-dark);display:flex;flex-direction:column;flex-shrink:0;z-index:100;}
.sidebar-logo{padding:24px 20px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-logo-icon{width:36px;height:36px;background:var(--green-mid);border-radius:10px;display:flex;align-items:center;justify-content:center;}
.sidebar-logo-icon svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;}
.sidebar-logo-text{font-size:15px;font-weight:700;color:#fff;}
.sidebar-logo-sub{font-size:10px;color:rgba(255,255,255,.4);margin-top:1px;letter-spacing:.04em;text-transform:uppercase;}
.sidebar-nav{padding:16px 12px;flex:1;}
.nav-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.3);padding:0 8px;margin-bottom:8px;margin-top:16px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);color:rgba(255,255,255,.6);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;font-family:inherit;}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff;}
.nav-item.active{background:var(--green-mid);color:#fff;font-weight:600;}
.nav-item svg{width:16px;height:16px;flex-shrink:0;}
.nav-badge{margin-left:auto;background:var(--green-light);color:var(--green-dark);font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px;}
.sidebar-footer{padding:16px 12px;border-top:1px solid rgba(255,255,255,.08);}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--green-mid);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{height:64px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0;box-shadow:var(--shadow);}
.topbar-title{font-size:18px;font-weight:700;flex:1;}
.live-chip{display:flex;align-items:center;gap:5px;background:var(--green-xlight);color:var(--green);padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green-mid);box-shadow:0 0 0 3px rgba(64,145,108,.2);}
.content-area{flex:1;overflow-y:auto;padding:24px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;transition:all .15s;}
.btn:hover{background:var(--green-xlight);border-color:var(--green-light);color:var(--green);}
.btn-primary{background:var(--green);color:#fff;border-color:var(--green);}
.btn-primary:hover{background:var(--green-dark);}
.btn-sm{padding:6px 14px;font-size:11px;}
.filter-bar{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:16px 20px;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;box-shadow:var(--shadow);}
.fg{display:flex;flex-direction:column;gap:5px;}
.fg label{font-size:10px;font-weight:700;color:var(--text-sec);letter-spacing:.06em;text-transform:uppercase;}
.fg select,.fg input{border:1.5px solid var(--border);border-radius:20px;padding:7px 14px;font-size:12px;color:var(--text);background:var(--bg);font-family:inherit;outline:none;}
.fg select:focus,.fg input:focus{border-color:var(--green-mid);}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:20px;}
.kpi-card{background:var(--surface);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);cursor:pointer;transition:all .2s;border:1.5px solid transparent;position:relative;overflow:hidden;}
.kpi-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:var(--green-light);}
.kpi-card.featured{background:linear-gradient(135deg,var(--green-dark) 0%,var(--green) 100%);color:#fff;}
.kpi-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
.kpi-icon svg{width:20px;height:20px;}
.kpi-label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-sec);margin-bottom:8px;}
.kpi-card.featured .kpi-label{color:rgba(255,255,255,.7);}
.kpi-value{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-bottom:6px;}
.kpi-card.featured .kpi-value{color:#fff;}
.kpi-trend{font-size:11px;color:var(--text-ter);}
.kpi-card.featured .kpi-trend{color:rgba(255,255,255,.5);}
.kpi-mes{font-size:10px;color:var(--text-ter);margin-top:2px;line-height:1.5;}
.kpi-sparkline{margin-top:12px;height:40px;}
/* ALERT */
.alert-banner{background:linear-gradient(135deg,#fff0f0 0%,#fff5f0 100%);border:1.5px solid #fecaca;border-radius:var(--r);padding:20px 24px;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:24px;align-items:center;}
.alert-icon{width:48px;height:48px;background:var(--danger-light);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.alert-body{flex:1;min-width:200px;}
.alert-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--danger);margin-bottom:4px;}
.alert-amount{font-size:28px;font-weight:800;color:var(--danger);letter-spacing:-.03em;cursor:pointer;}
.alert-sub{font-size:11px;color:#b91c1c;margin-top:3px;}
.alert-stats{display:flex;gap:20px;flex-wrap:wrap;}
.astat-label{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-sec);margin-bottom:3px;}
.astat-val{font-size:24px;font-weight:800;cursor:pointer;}
.astat-sub{font-size:10px;color:var(--text-ter);margin-top:2px;}
/* CHARTS */
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
@media(max-width:900px){.charts-row{grid-template-columns:1fr;}}
.card{background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);margin-bottom:16px;border:1.5px solid var(--border);}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.card-title{font-size:14px;font-weight:700;}
.card-subtitle{font-size:11px;color:var(--text-ter);background:var(--bg);padding:3px 10px;border-radius:20px;}
.chart-wrap{position:relative;}
.chart-wrap.h180{height:180px;}.chart-wrap.h260{height:260px;}.chart-wrap.h300{height:300px;}
.donut-legend{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
.dl-item{display:flex;align-items:center;justify-content:space-between;font-size:12px;}
.dl-left{display:flex;align-items:center;gap:8px;color:var(--text-sec);}
.dl-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0;}
.dl-pct{font-weight:700;}
.tabs{display:flex;gap:4px;margin-bottom:14px;background:var(--bg);border-radius:20px;padding:4px;width:fit-content;}
.tab{padding:6px 16px;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-sec);border:none;background:transparent;font-family:inherit;transition:all .15s;}
.tab.active{background:var(--green);color:#fff;}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-ter);padding:8px 12px;border-bottom:1.5px solid var(--border);white-space:nowrap;}
tbody td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:var(--green-bg);}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap;}
.badge.ok{background:var(--green-xlight);color:var(--green);}
.badge.warn{background:var(--warning-light);color:#c07a30;}
.badge.danger{background:var(--danger-light);color:var(--danger);}
.badge.neutral{background:var(--bg);color:var(--text-sec);}
.exp-link{color:var(--green);font-weight:700;cursor:pointer;}
.exp-link:hover{text-decoration:underline;}
/* MAP */
#mapTab{display:none;}
.map-shell{display:grid;grid-template-columns:280px 1fr;gap:16px;height:calc(100vh - 240px);min-height:480px;}
.map-sidebar{background:var(--surface);border-radius:var(--r);padding:16px;overflow-y:auto;box-shadow:var(--shadow);border:1.5px solid var(--border);display:flex;flex-direction:column;gap:12px;}
.map-sidebar-title{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-ter);margin-bottom:4px;}
.legend-pin{width:13px;height:13px;border-radius:50%;flex-shrink:0;border:2px solid rgba(0,0,0,.12);}
.geo-progress{font-size:11px;color:var(--text-sec);background:var(--bg);border-radius:var(--r-sm);padding:10px 12px;}
.geo-bar-wrap{background:var(--border);border-radius:20px;height:5px;margin-top:6px;overflow:hidden;}
.geo-bar{height:5px;border-radius:20px;background:var(--green-mid);transition:width .3s;}
.map-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.map-stat{background:var(--green-bg);border-radius:var(--r-sm);padding:10px 12px;text-align:center;border:1px solid var(--green-xlight);}
.map-stat-val{font-size:20px;font-weight:800;color:var(--green);}
.map-stat-label{font-size:10px;color:var(--text-ter);margin-top:2px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
.map-inc-list{flex:1;overflow-y:auto;}
.map-inc-item{padding:9px 10px;border-radius:var(--r-sm);cursor:pointer;border:1.5px solid transparent;margin-bottom:4px;}
.map-inc-item:hover{background:var(--green-bg);border-color:var(--green-xlight);}
.map-inc-exp{font-size:12px;font-weight:700;color:var(--green);}
.map-inc-mun{font-size:11px;color:var(--text-sec);margin-top:1px;}
#map{border-radius:var(--r);border:1.5px solid var(--border);box-shadow:var(--shadow);}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(17,24,39,.5);backdrop-filter:blur(6px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;}
.modal{background:var(--surface);border-radius:var(--r);width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.18);}
.modal.sm{max-width:820px;}.modal.lg{max-width:1140px;}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1.5px solid var(--border);flex-shrink:0;}
.modal-hdr h2{font-size:15px;font-weight:700;}
.modal-hdr-actions{display:flex;gap:8px;}
.modal-body{overflow:auto;padding:24px;flex:1;}
.modal-close{background:none;border:none;cursor:pointer;color:var(--text-sec);font-size:20px;padding:4px 8px;border-radius:var(--r-xs);font-family:inherit;line-height:1;}
.modal-close:hover{background:var(--bg);}
.ficha-section{margin-bottom:24px;}
.ficha-section-title{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-ter);margin-bottom:12px;padding-bottom:8px;border-bottom:1.5px solid var(--border);}
.ficha-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;}
.ficha-field .fl{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-ter);margin-bottom:4px;}
.ficha-field .fv{font-size:13px;font-weight:500;}
.recl{background:var(--green-bg);border-radius:var(--r-sm);padding:14px 16px;font-size:12px;line-height:1.6;color:var(--text-sec);white-space:pre-wrap;border-left:3px solid var(--green-mid);}
.placeholder{text-align:center;padding:48px 24px;color:var(--text-ter);}
.placeholder strong{display:block;font-size:15px;color:var(--text-sec);margin-bottom:6px;}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
      <div><div class="sidebar-logo-text">AVRA Jaén</div><div class="sidebar-logo-sub">Serveo · Contrato</div></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-label">Principal</div>
      <button class="nav-item active" id="navDash">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </button>
      <button class="nav-item" id="navMap">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
        Mapa de incidencias
        <span class="nav-badge" id="navMapBadge">…</span>
      </button>
      <div class="nav-label" style="margin-top:20px">Acciones</div>
      <button class="nav-item" id="navRefresh">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 4v6h6"/><path d="M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg>
        Actualizar datos
      </button>
    </nav>
    <div class="sidebar-footer">
      <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;">
        <div class="avatar">CF</div>
        <div><div style="font-size:12px;font-weight:600;color:#fff">Serveo AVRA</div><div style="font-size:10px;color:rgba(255,255,255,.4)">Supervisor obras</div></div>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div style="flex:1"><div class="topbar-title">Control de Incidencias — Jaén</div></div>
      <div class="live-chip"><span class="live-dot"></span><span id="statusText">Cargando…</span></div>
    </div>
    <div class="content-area">
      <div class="filter-bar">
        <div class="fg"><label>Filtrar por fecha</label>
          <select id="filtroTipoFecha">
            <option value="peticion">F. Petición presupuesto</option>
            <option value="aprobacion">F. Aprobación AVRA</option>
            <option value="conformidad">F. Conformidad</option>
            <option value="facturado">F. Facturado</option>
          </select>
        </div>
        <div class="fg"><label>Mes / Año</label><select id="filtroMes"><option value="">— Todos —</option></select></div>
        <div class="fg"><label>Desde</label><input type="date" id="filtroDesde"></div>
        <div class="fg"><label>Hasta</label><input type="date" id="filtroHasta"></div>
        <div class="fg"><label>Municipio</label><select id="filtroMunicipio"><option value="">— Todos —</option></select></div>
        <div class="fg"><label>Estado</label><select id="filtroEstado"><option value="">— Todos —</option></select></div>
        <div style="display:flex;gap:8px;align-items:flex-end;">
          <button class="btn btn-primary btn-sm" id="btnAplicar">Aplicar</button>
          <button class="btn btn-sm" id="btnLimpiar">Limpiar</button>
        </div>
      </div>
      <div id="dashTab"><div id="content"><div class="placeholder"><strong>Conectando…</strong>Cargando datos en vivo</div></div></div>
      <div id="mapTab">
        <div class="map-shell">
          <div class="map-sidebar">
            <div><div class="map-sidebar-title">Estado · Filtrar</div><div id="mapLegend" style="display:flex;flex-direction:column;gap:4px;margin-bottom:10px;"></div></div>
            <div id="geoProgress" style="display:none;" class="geo-progress"><div id="geoText">Geocodificando…</div><div class="geo-bar-wrap"><div class="geo-bar" id="geoBar" style="width:0%"></div></div></div>
            <div class="map-stats" id="mapStats"></div>
            <div class="map-sidebar-title" style="margin-top:4px;">Incidencias</div>
            <div class="map-inc-list" id="mapIncList"></div>
            <div id="mapNoUbicadas" style="display:none;background:var(--warning-light);border:1.5px solid #fde68a;border-radius:var(--r-sm);padding:10px 12px;margin-top:8px;"></div>
          </div>
          <div id="map"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="fichaOverlay" style="display:none;">
  <div class="modal sm">
    <div class="modal-hdr"><h2 id="fichaTitle">Ficha</h2><button class="modal-close" id="fichaClose">✕</button></div>
    <div class="modal-body" id="fichaBody"></div>
  </div>
</div>
<div class="overlay" id="modalOverlay" style="display:none;">
  <div class="modal lg">
    <div class="modal-hdr">
      <h2 id="modalTitle">Incidencias</h2>
      <div class="modal-hdr-actions"><button class="btn btn-sm" id="btnDescargaExcel">⬇ Excel</button><button class="btn btn-sm" id="btnDescargaPDF">⬇ PDF</button><button class="modal-close" id="modalClose">✕</button></div>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
const GIST_RAW="https://gist.githubusercontent.com/cferberia-cmd/428e16516bae61ac35c15be1c8b6fd8f/raw/incidencias.json";
const REFRESH_MS=5*60*1000;
const GEO_CACHE_KEY='avra_geo_v3';
let charts=[],rawRows=[],filteredRows=[],modalRows=[],modalTitleText='';
let KEYS={},leafletMap=null,markers=[],currentTab='dash';
let geoCache={};try{geoCache=JSON.parse(localStorage.getItem(GEO_CACHE_KEY)||'{}');}catch(e){geoCache={};}
let munMarkers={},dirMarkers={};
let activeEstados=new Set(['Pdte. presupuesto','Pdte. aprobación','Aprobado','Facturado','No procede','Sin estado']);

/* ─── UTILS ─── */
const norm=s=>s?String(s).trim().toUpperCase().replace(/[\s\n]+/g,' '):'';
function findKey(row,cands){const ks=Object.keys(row);for(const c of cands){const f=ks.find(k=>norm(k).includes(c));if(f)return f;}return null;}
function parseNum(v){if(!v&&v!==0)return 0;if(typeof v==='number')return v;const n=parseFloat(String(v).replace(/[^\d,.-]/g,'').replace(/\.(?=\d{3})/g,'').replace(',','.'));return isNaN(n)?0:n;}

function excelDate(v){
  if(v===null||v===undefined||v==='')return null;
  if(typeof v==='string'){
    const s=v.trim();
    if(!s)return null;
    const nu=norm(s);
    if(nu.includes('NO PROCEDE')||nu.includes('PROCEDE'))return null;
    if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)){
      const p=s.split('/');
      const d=new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));
      return isNaN(d.getTime())?null:d;
    }
    if(/^\d{4}-\d{2}-\d{2}/.test(s)){const d=new Date(s);return isNaN(d.getTime())?null:d;}
    const n2=parseFloat(s);
    if(!isNaN(n2)&&n2>40000)return new Date(Math.round((n2-25569)*86400*1000));
    return null;
  }
  const n=typeof v==='number'?v:parseFloat(v);
  if(isNaN(n)||n<1)return null;
  return new Date(Math.round((n-25569)*86400*1000));
}

const fmtDate=v=>{const d=excelDate(v);return d?d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'}):'—';};
const monthKey=d=>d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`:null;
const monthLabel=k=>{if(!k)return'';const[y,m]=k.split('-');return`${['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'][parseInt(m)-1]} ${y}`;};
const euro=v=>'€ '+Math.round(v).toLocaleString('es-ES');
const euro2=v=>'€ '+v.toLocaleString('es-ES',{minimumFractionDigits:2});

function addDiasLab(d,n){let cur=new Date(d),a=0;while(a<n){cur.setDate(cur.getDate()+1);if(cur.getDay()!==0&&cur.getDay()!==6)a++;}return cur;}

function diasLabTranscurridos(desde,hasta){
  if(!desde||!hasta)return 0;
  let c=0,cur=new Date(desde);
  cur.setHours(0,0,0,0);
  const end=new Date(hasta);
  end.setHours(0,0,0,0);
  while(cur<end){cur.setDate(cur.getDate()+1);if(cur.getDay()!==0&&cur.getDay()!==6)c++;}
  return c;
}

function diasLabRestantes(d1,d2){
  if(!d1||!d2)return 0;
  let c=0,cur=new Date(d1);
  const e=new Date(d2);
  while(cur<e){cur.setDate(cur.getDate()+1);if(cur.getDay()!==0&&cur.getDay()!==6)c++;}
  return c;
}

function normEstado(s){s=norm(s);if(s.includes('NO PROCEDE'))return'No procede';if(s.includes('PENDIENTE PRESUPUESTO'))return'Pdte. presupuesto';if(s.includes('PENDIENTE APROBACION')||s.includes('PENDIENTE APROBACIÓN'))return'Pdte. aprobación';if(s.includes('PRESUPUESTO APROBADO'))return'Aprobado';return s||'Sin estado';}
function normObra(s){s=norm(s);if(s.includes('FACTURADO'))return'Facturado';if(s.includes('EN EJECUCION')||s.includes('EN EJECUCIÓN'))return'En ejecución';if(s.includes('EJECUTADO'))return'Ejecutado';return s||'';}
function normProv(s){s=norm(s);if(s.includes('CEION')&&s.includes('ALGUACIL'))return'CEION-Adán Alguacil';if(s.includes('CEION'))return'CEION';if(s.includes('SERVEO'))return'SERVEO';return s||'Sin asignar';}

const ESTADO_COLOR={'Pdte. presupuesto':'#f4a261','Pdte. aprobación':'#457b9d','Aprobado':'#2d6a4f','Facturado':'#6d597a','No procede':'#e63946'};
function colorForEstado(e){return ESTADO_COLOR[e]||'#6b7a74';}

function alertBadge(s,d){
  if(s==='excluida')return`<span class="badge neutral">Excluida</span>`;
  if(s==='cumplido')return`<span class="badge ok">✓ OK</span>`;
  if(s==='vencido')return`<span class="badge danger">⚠ Vencido</span>`;
  if(s==='warning')return`<span class="badge warn">⏱ ${d}d</span>`;
  if(s==='ok')return`<span class="badge ok">✓ ${d}d</span>`;
  return`<span class="badge neutral">—</span>`;
}

function destroyCharts(){charts.forEach(c=>c.destroy());charts=[];}
function sparkline(id,data,color){
  const ctx=document.getElementById(id);if(!ctx||!data.length)return;
  const c=new Chart(ctx,{type:'line',data:{labels:data.map((_,i)=>i),datasets:[{data,borderColor:color,borderWidth:2,fill:true,backgroundColor:color+'18',tension:.4,pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{display:false},y:{display:false}},animation:false}});
  charts.push(c);
}

/* ─── PROCESS ROWS ─── */
function processRows(rows){
  if(!rows.length)return[];
  const s=rows[0];
  KEYS={
    exp:findKey(s,['NUMERO DE EXPEDIENTE','EXPEDIENTE']),
    titular:findKey(s,['TITULAR O REPRESENTANTE','TITULAR']),
    telefono:findKey(s,['TELÉFONO','TELEFONO']),
    tipoVia:findKey(s,['TIPO VÍA','TIPO VIA']),
    direccion:findKey(s,['DIRECCIÓN','DIRECCION']),
    numero:findKey(s,['Nº']),
    bloque:findKey(s,['BLOQUE']),
    piso:findKey(s,['PISO']),
    puerta:findKey(s,['PUERTA']),
    provincia:findKey(s,['PROVINCIA']),
    reclamacion:findKey(s,['CONTENIDO RECLAMACIÓN','CONTENIDO RECLAMACION']),
    est:findKey(s,['ESTADO SERVEO','ESTADO']),
    prov:findKey(s,['PROVEEDOR']),
    mun:findKey(s,['MUNICIPIO']),
    base:findKey(s,['BASE PRESUPUESTO SERVEO']),
    total:findKey(s,['TOTAL']),
    obra:findKey(s,['ESTADO OBRA']),
    fPet:findKey(s,['FECHA DE PETICION DE PRESUPUESTO','FECHA PETICION']),
    fPres:findKey(s,['FECHA PRESUPUESTO']),
    fApr:findKey(s,['FECHA APROBACION AVRA','APROBADO POR AVRA']),
    fCon:findKey(s,['FECHA CONFORMIDAD']),
    fFact:findKey(s,['FACTURADO']),
    penal:findKey(s,['PENALIZACION','PENALIZACIÓN']),
    prior:findKey(s,['PRIORITARIO'])
  };

  const HOY=new Date();HOY.setHours(0,0,0,0);

  return rows.map(r=>{
    const estado   = normEstado(KEYS.est?r[KEYS.est]:null);
    const obraLabel= normObra(KEYS.obra?r[KEYS.obra]:'');
    const base     = parseNum(KEYS.base?r[KEYS.base]:0);
    const total    = parseNum(KEYS.total?r[KEYS.total]:0);

    // Penalización: campo contiene el mes (texto) → 10% base; si es número → ese número
    const penalRawVal = KEYS.penal?r[KEYS.penal]:null;
    const penalStr    = penalRawVal?String(penalRawVal).trim():'';
    const penalNum2   = parseFloat(penalStr.replace(/[^\d,.-]/g,'').replace(',','.'));
    const penalReal   = penalStr===''?0:(isNaN(penalNum2)?base*0.1:penalNum2);
    const esPenalizada= penalStr!=='';

    // Fecha facturado — puede ser dd/mm/yyyy, número serie, "NO PROCEDE" o vacío
    const fFactRawVal = KEYS.fFact?r[KEYS.fFact]:null;
    const fFactStr2   = fFactRawVal?norm(String(fFactRawVal)):'';
    const fFactParsed = (fFactStr2===''||fFactStr2.includes('NO PROCEDE')||fFactStr2.includes('PROCEDE'))
                        ? null : excelDate(fFactRawVal);
    const esFacturada = fFactParsed!==null;
    const fFactVal    = fFactParsed; // Date o null

    // Otras fechas
    const fPetVal  = excelDate(KEYS.fPet ?r[KEYS.fPet] :null);
    const fPresVal = excelDate(KEYS.fPres?r[KEYS.fPres]:null);
    const fAprVal  = excelDate(KEYS.fApr ?r[KEYS.fApr] :null);
    const fConVal  = excelDate(KEYS.fCon ?r[KEYS.fCon] :null);

    // Control plazo presupuesto (3 días lab)
    const excluida=(obraLabel==='Facturado'||estado==='No procede'||esFacturada);
    let p1Status='sin-fecha',p1Dias=null,p2Status='sin-fecha',p2Dias=null,penalEst=0;
    if(!excluida){
      if(fPetVal){
        const lim1=addDiasLab(fPetVal,3);
        if(fPresVal){p1Status=fPresVal<=lim1?'cumplido':'vencido';if(p1Status==='vencido')penalEst+=base*.1;}
        else{const dr=diasLabRestantes(HOY,lim1);if(HOY>lim1){p1Status='vencido';penalEst+=base*.1;}else if(dr<=3){p1Status='warning';p1Dias=dr;}else{p1Status='ok';p1Dias=dr;}}
      }
      if(fAprVal){
        const lim2=new Date(fAprVal);lim2.setMonth(lim2.getMonth()+2);
        if(obraLabel==='Ejecutado'||obraLabel==='Facturado'){p2Status='cumplido';}
        else{const dr=diasLabRestantes(HOY,lim2);if(HOY>lim2){p2Status='vencido';penalEst+=base*.1;}else if(dr<=3){p2Status='warning';p2Dias=dr;}else{p2Status='ok';p2Dias=dr;}}
      }
    }else{p1Status='excluida';p2Status='excluida';}

    // Control 60 días laborables desde aprobación → penalización por ejecución
    let pen60=null,pen60Dias=null;
    if(estado==='Aprobado'&&!esFacturada&&fAprVal){
      const dt=diasLabTranscurridos(fAprVal,HOY);
      const dr=60-dt;
      if(dt>=60){pen60='vencida';pen60Dias=dt-60;}
      else if(dr<=15){pen60='aviso';pen60Dias=dr;}
      else{pen60='plazo';pen60Dias=dr;}
    }

    const mu=KEYS.mun?String(r[KEYS.mun]||'').trim():'';
    const pr=KEYS.provincia?String(r[KEYS.provincia]||'').trim():'Jaén';
    const tv=KEYS.tipoVia?norm(r[KEYS.tipoVia]):'';
    const di=KEYS.direccion?String(r[KEYS.direccion]||'').trim():'';
    const nu=KEYS.numero?String(r[KEYS.numero]||'').trim():'';
    const fullAddr=[tv,di,nu,mu,pr,'España'].filter(Boolean).join(', ');

    return{
      raw:r,
      exp:r[KEYS.exp]||'—',municipio:mu,estado,obraLabel,
      prov:normProv(KEYS.prov?r[KEYS.prov]:null),
      base,total,penalReal,penalEst,excluida,esFacturada,esPenalizada,
      fPet:fPetVal,fPres:fPresVal,fApr:fAprVal,fCon:fConVal,fFact:fFactVal,
      p1Status,p1Dias,p2Status,p2Dias,
      prior:!!(KEYS.prior&&r[KEYS.prior]&&norm(r[KEYS.prior])!==''),
      pen60,pen60Dias,
      fullAddr,geoKey:fullAddr.toLowerCase()
    };
  });
}

/* ─── FILTROS ─── */
function getDateForField(row,campo){
  if(campo==='peticion')return row.fPet;
  if(campo==='aprobacion')return row.fApr;
  if(campo==='conformidad')return row.fCon;
  if(campo==='facturado')return row.fFact;
  return null;
}
function applyFilters(){
  const campo=document.getElementById('filtroTipoFecha').value;
  const mes=document.getElementById('filtroMes').value;
  const dv=document.getElementById('filtroDesde').value,hv=document.getElementById('filtroHasta').value;
  const desde=dv?new Date(dv):null,hasta=hv?new Date(hv):null;
  const mun=document.getElementById('filtroMunicipio').value,est=document.getElementById('filtroEstado').value;
  filteredRows=rawRows.filter(r=>{
    const fd=getDateForField(r,campo);
    if(mes&&monthKey(fd)!==mes)return false;
    if(desde&&(!fd||fd<desde))return false;
    if(hasta){const h=new Date(hasta);h.setHours(23,59,59);if(!fd||fd>h)return false;}
    if(mun&&r.municipio!==mun)return false;
    if(est&&r.estado!==est)return false;
    return true;
  });
  if(currentTab==='dash')renderDashboard();else renderMap();
}
function limpiarFiltros(){
  ['filtroMes','filtroMunicipio','filtroEstado'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('filtroDesde').value='';document.getElementById('filtroHasta').value='';
  filteredRows=[...rawRows];
  if(currentTab==='dash')renderDashboard();else renderMap();
}
function populateFiltros(){
  const campo=document.getElementById('filtroTipoFecha').value;
  const meses=new Set(),municipios=new Set(),estados=new Set();
  rawRows.forEach(r=>{
    const mk=monthKey(getDateForField(r,campo));if(mk)meses.add(mk);
    if(r.municipio&&r.municipio!=='—')municipios.add(r.municipio);
    if(r.estado)estados.add(r.estado);
  });
  const pop=(id,items,cur)=>{document.getElementById(id).innerHTML='<option value="">— Todos —</option>'+[...items].sort().map(v=>`<option value="${v}"${v===cur?' selected':''}>${v.length===7&&v.includes('-')?monthLabel(v):v}</option>`).join('');};
  pop('filtroMes',meses,document.getElementById('filtroMes').value);
  pop('filtroMunicipio',municipios,document.getElementById('filtroMunicipio').value);
  pop('filtroEstado',estados,document.getElementById('filtroEstado').value);
}

function renderPlazoTabla(tab){
  document.querySelectorAll('.ptab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  const rows=filteredRows.filter(r=>{
    if(tab==='todas')return true;
    if(tab==='vencidas')return r.p1Status==='vencido'||r.p2Status==='vencido';
    if(tab==='aviso')return r.p1Status==='warning'||r.p2Status==='warning';
    if(tab==='ok')return['ok','cumplido'].includes(r.p1Status)&&!['vencido','warning'].includes(r.p2Status);
    return true;
  });
  const tb=document.getElementById('plazoTbody');if(!tb)return;
  if(!rows.length){tb.innerHTML=`<tr><td colspan="8" style="text-align:center;padding:24px;color:var(--text-ter)">Sin incidencias</td></tr>`;return;}
  tb.innerHTML=rows.map(r=>`<tr>
    <td><span class="exp-link" data-exp="${r.exp}">${r.exp}</span></td>
    <td>${r.municipio}</td>
    <td>${KEYS.fPet?fmtDate(r.raw[KEYS.fPet]):'—'}</td>
    <td>${alertBadge(r.p1Status,r.p1Dias)}</td>
    <td>${KEYS.fApr?fmtDate(r.raw[KEYS.fApr]):'—'}</td>
    <td>${alertBadge(r.p2Status,r.p2Dias)}</td>

    <td style="text-align:right">${r.penalEst>0?`<span class="badge danger">${euro2(r.penalEst)}</span>`:'—'}</td>
  </tr>`).join('');
}

/* ─── MAPA ─── */
const munGeoCache={};
function sleep(ms){return new Promise(res=>setTimeout(res,ms));}

async function geocodeMun(mun,intentos=3){
  if(munGeoCache[mun])return munGeoCache[mun];
  for(let i=0;i<intentos;i++){
    try{
      const q=encodeURIComponent(`${mun}, Jaén, España`);
      const res=await fetch(`https://nominatim.openstreetmap.org/search?q=${q}&format=json&limit=1&countrycodes=es`,{headers:{'Accept-Language':'es','User-Agent':'AVRAJaenDashboard/1.0'}});
      if(!res.ok){await sleep(2000*(i+1));continue;}
      const d=await res.json();
      if(d&&d[0]){const c={lat:parseFloat(d[0].lat),lng:parseFloat(d[0].lon)};munGeoCache[mun]=c;return c;}
    }catch(e){await sleep(2000*(i+1));}
  }
  return null;
}
async function geocodeDir(row){
  if(geoCache[row.geoKey])return geoCache[row.geoKey];
  try{
    const res=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(row.fullAddr)}&format=json&limit=1&countrycodes=es`,{headers:{'Accept-Language':'es','User-Agent':'AVRAJaenDashboard/1.0'}});
    const d=await res.json();
    if(d&&d[0]){const c={lat:parseFloat(d[0].lat),lng:parseFloat(d[0].lon)};geoCache[row.geoKey]=c;localStorage.setItem(GEO_CACHE_KEY,JSON.stringify(geoCache));return c;}
  }catch(e){}
  return null;
}
function mkPinIcon(color,size=26){const h=Math.round(size*1.36);return L.divIcon({html:`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${h}" viewBox="0 0 28 38"><path d="M14 0C6.27 0 0 6.27 0 14c0 9.63 14 24 14 24S28 23.63 28 14C28 6.27 21.73 0 14 0z" fill="${color}" stroke="white" stroke-width="2"/><circle cx="14" cy="14" r="6" fill="white" opacity="0.9"/></svg>`,iconSize:[size,h],iconAnchor:[size/2,h],popupAnchor:[0,-h],className:''});}
function mkClusterIcon(color,count){return L.divIcon({html:`<svg xmlns="http://www.w3.org/2000/svg" width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="21" fill="${color}" stroke="white" stroke-width="2.5" opacity=".92"/><text x="23" y="28" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="${count>9?13:15}" font-weight="800" fill="white">${count}</text></svg>`,iconSize:[46,46],iconAnchor:[23,23],popupAnchor:[0,-23],className:''});}

function buildMapLegend(rows){
  const ESTADOS=[{key:'Pdte. presupuesto',color:'#f4a261'},{key:'Pdte. aprobación',color:'#457b9d'},{key:'Aprobado',color:'#2d6a4f'},{key:'Facturado',color:'#6d597a'},{key:'No procede',color:'#e63946'},{key:'Sin estado',color:'#6b7a74'}];
  const counts={};rows.forEach(r=>{counts[r.estado]=(counts[r.estado]||0)+1;});
  const el=document.getElementById('mapLegend');if(!el)return;
  el.innerHTML=ESTADOS.map(e=>`<label style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:5px 8px;border-radius:8px" onmouseover="this.style.background='var(--green-bg)'" onmouseout="this.style.background='transparent'">
    <input type="checkbox" ${activeEstados.has(e.key)?'checked':''} data-estado="${e.key}" style="accent-color:${e.color};width:14px;height:14px;cursor:pointer">
    <span class="legend-pin" style="background:${e.color}"></span>
    <span style="font-size:12px;color:var(--text-sec);flex:1">${e.key}</span>
    <span style="font-size:11px;font-weight:700;color:var(--text-ter)">${counts[e.key]||0}</span>
  </label>`).join('')+`<div style="display:flex;gap:6px;margin-top:6px"><button onclick="selectAllEstados(true)" class="btn btn-sm" style="flex:1">✓ Todos</button><button onclick="selectAllEstados(false)" class="btn btn-sm" style="flex:1">✕ Ninguno</button></div>`;
  el.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.addEventListener('change',()=>{if(cb.checked)activeEstados.add(cb.dataset.estado);else activeEstados.delete(cb.dataset.estado);applyMapFilter();}));
}
function applyMapFilter(){
  if(!leafletMap)return;
  Object.values(munMarkers).forEach(m=>m.remove());munMarkers={};
  const vis=filteredRows.filter(r=>activeEstados.has(r.estado));
  const byMun={};vis.forEach(r=>{if(!byMun[r.municipio])byMun[r.municipio]=[];byMun[r.municipio].push(r);});
  Object.entries(byMun).forEach(([mun,munRows])=>{
    const coords=munGeoCache[mun];if(!coords)return;
    const ec={};munRows.forEach(r=>{ec[r.estado]=(ec[r.estado]||0)+1;});
    const dom=Object.entries(ec).sort((a,b)=>b[1]-a[1])[0][0];
    const icon=munRows.length===1?mkPinIcon(colorForEstado(dom)):mkClusterIcon(colorForEstado(dom),munRows.length);
    const m=L.marker([coords.lat,coords.lng],{icon}).addTo(leafletMap);
    m.bindPopup(L.popup({maxWidth:300}).setContent(popupMun(mun,munRows)));
    munMarkers[mun]=m;
  });
  Object.entries(dirMarkers).forEach(([exp,marker])=>{
    const row=filteredRows.find(r=>r.exp===exp);
    if(row&&activeEstados.has(row.estado)){if(!leafletMap.hasLayer(marker))marker.addTo(leafletMap);}
    else if(leafletMap.hasLayer(marker))marker.remove();
  });
  const list=document.getElementById('mapIncList');
  if(list)list.querySelectorAll('.map-inc-item').forEach(item=>{const row=filteredRows.find(r=>r.exp===item.dataset.exp);item.style.display=(row&&activeEstados.has(row.estado))?'block':'none';});
}
window.selectAllEstados=val=>{
  activeEstados=new Set(val?['Pdte. presupuesto','Pdte. aprobación','Aprobado','Facturado','No procede','Sin estado']:[]);
  document.querySelectorAll('#mapLegend input[type=checkbox]').forEach(cb=>{cb.checked=val;});
  applyMapFilter();
};
function popupMun(mun,rows){

  <div style="max-height:260px;overflow-y:auto">${rows.map(r=>`<div onclick="window._openFichaExp('${r.exp}')" style="padding:7px 8px;border-radius:8px;cursor:pointer;margin-bottom:4px;background:#f4f6f5;border:1px solid #e4ebe7" onmouseover="this.style.background='#d8f3dc'" onmouseout="this.style.background='#f4f6f5'">
    <div style="font-size:12px;font-weight:700;color:#2d6a4f">${r.exp}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:3px">
      <span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:${colorForEstado(r.estado)}20;color:${colorForEstado(r.estado)}">${r.estado}</span>
      ${r.base>0?`<span style="font-size:10px;color:#6b7a74">${euro2(r.base)}</span>`:''}
    </div>
  </div>`).join('')}</div></div>`;
}
function renderNoUbicadas(sinDir,noGeo){

    <div style="display:flex;align-items:center;gap:6px"><span>⚠️</span><span style="font-size:12px;font-weight:700;color:var(--warning)">Sin ubicar</span><span style="background:var(--warning-light);color:#c07a30;padding:1px 7px;border-radius:20px;font-size:11px;font-weight:700">${todas.length}</span></div>

async function renderMap(){
  const rows=filteredRows;
  if(!leafletMap){
    leafletMap=L.map('map',{zoomControl:true}).setView([37.9,-3.4],10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',maxZoom:19}).addTo(leafletMap);
  }
  markers.forEach(m=>m.remove());markers=[];
  Object.values(munMarkers).forEach(m=>m.remove());munMarkers={};
  Object.values(dirMarkers).forEach(m=>m.remove());dirMarkers={};
  buildMapLegend(rows);
  document.getElementById('mapStats').innerHTML=`
    <div class="map-stat"><div class="map-stat-val">${rows.length}</div><div class="map-stat-label">Total</div></div>
    <div class="map-stat"><div class="map-stat-val" style="color:var(--danger)">${rows.filter(r=>r.pen60==='vencida').length}</div><div class="map-stat-label">Vencidas</div></div>
    <div class="map-stat"><div class="map-stat-val" style="color:var(--green)">${rows.filter(r=>r.estado==='Aprobado').length}</div><div class="map-stat-label">Aprobadas</div></div>
    <div class="map-stat"><div class="map-stat-val" style="color:var(--warning)">${rows.filter(r=>r.estado==='Pdte. presupuesto').length}</div><div class="map-stat-label">Pdte.ppto.</div></div>`;
  document.getElementById('navMapBadge').textContent=rows.length;
  document.getElementById('mapIncList').innerHTML=rows.map(r=>`<div class="map-inc-item" data-exp="${r.exp}">
    <div class="map-inc-exp">${r.exp}</div><div class="map-inc-mun">${r.municipio}</div>
    <div style="margin-top:4px"><span class="badge" style="background:${colorForEstado(r.estado)}18;color:${colorForEstado(r.estado)}">${r.estado}</span></div>
  </div>`).join('');
  const sinDir=[],byMun={};
  rows.forEach(r=>{if(!r.fullAddr||r.fullAddr.replace(/,/g,'').replace(/España/i,'').trim().length<=5)sinDir.push(r);if(!byMun[r.municipio])byMun[r.municipio]=[];byMun[r.municipio].push(r);});
  const munList=Object.keys(byMun);
  const progEl=document.getElementById('geoProgress'),progText=document.getElementById('geoText'),progBar=document.getElementById('geoBar');
  progEl.style.display='block';
  const munBounds=[];
  for(let i=0;i<munList.length;i++){
    const mun=munList[i],munRows=byMun[mun];
    if(!munGeoCache[mun])await sleep(1100);
    const coords=await geocodeMun(mun);
    if(!coords)continue;
    munBounds.push([coords.lat,coords.lng]);
    const ec={};munRows.forEach(r=>{ec[r.estado]=(ec[r.estado]||0)+1;});
    const dom=Object.entries(ec).sort((a,b)=>b[1]-a[1])[0][0];
    const vRows=munRows.filter(r=>activeEstados.has(r.estado));
    if(!vRows.length)continue;
    const icon=vRows.length===1?mkPinIcon(colorForEstado(dom)):mkClusterIcon(colorForEstado(dom),vRows.length);
    const m=L.marker([coords.lat,coords.lng],{icon}).addTo(leafletMap);
    m.bindPopup(L.popup({maxWidth:300}).setContent(popupMun(mun,munRows)));
    munMarkers[mun]=m;markers.push(m);
    progText.textContent=`Municipios: ${i+1}/${munList.length}`;
    progBar.style.width=Math.round((i+1)/munList.length*100)+'%';
  }
  if(munBounds.length)leafletMap.fitBounds(munBounds,{padding:[40,40],maxZoom:12});
  setTimeout(()=>leafletMap.invalidateSize(),100);
  const noGeo=[],toRefine=rows.filter(r=>!geoCache[r.geoKey]);
  for(let i=0;i<toRefine.length;i++){
    if(currentTab!=='map')break;
    const row=toRefine[i];const coords=await geocodeDir(row);await sleep(1100);
    if(!coords){noGeo.push(row);continue;}
    if(!activeEstados.has(row.estado))continue;
    const dm=L.marker([coords.lat,coords.lng],{icon:mkPinIcon(colorForEstado(row.estado),22)}).addTo(leafletMap);
    dm.bindPopup(L.popup({maxWidth:280}).setContent(`<div style="font-family:-apple-system,sans-serif;min-width:220px"><div style="font-size:13px;font-weight:700;color:#2d6a4f;margin-bottom:4px">${row.exp}</div><span style="background:${colorForEstado(row.estado)}20;color:${colorForEstado(row.estado)};padding:2px 10px;border-radius:20px;font-size:10px;font-weight:700">${row.estado}</span>${row.base>0?`<div style="font-size:11px;margin-top:8px"><strong>Base:</strong> ${euro2(row.base)}</div>`:''}<button onclick="window._openFichaExp('${row.exp}')" style="margin-top:10px;width:100%;padding:8px;background:#2d6a4f;color:#fff;border:none;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer">Ver ficha →</button></div>`));
    dirMarkers[row.exp]=dm;markers.push(dm);
    progText.textContent=`Precisando: ${i+1}/${toRefine.length}`;
    progBar.style.width=Math.round((i+1)/toRefine.length*100)+'%';
  }
  progEl.style.display='none';
  renderNoUbicadas(sinDir,noGeo);
  document.getElementById('mapIncList').addEventListener('click',e=>{
    const item=e.target.closest('[data-exp]');if(!item)return;
    const row=filteredRows.find(r=>r.exp===item.dataset.exp);if(!row)return;
    const dm=dirMarkers[row.exp];
    if(dm){leafletMap.setView(dm.getLatLng(),16,{animate:true});dm.openPopup();return;}
    const mm=munMarkers[row.municipio];
    if(mm){leafletMap.setView(mm.getLatLng(),13,{animate:true});mm.openPopup();}else openFicha(row);
  });
}

    <div class="card-header"><span class="card-title">Control de plazos (presupuesto 3d lab.)</span></div>
    <div class="tabs">
      <button class="tab ptab active" data-tab="vencidas">⚠ Vencidas <span style="background:var(--danger-light);color:var(--danger);padding:1px 7px;border-radius:20px;font-size:10px;font-weight:700;margin-left:4px">0</span></button>
      <button class="tab ptab" data-tab="aviso">⏱ Aviso</button>
      <button class="tab ptab" data-tab="ok">✓ En plazo</button>
      <button class="tab ptab" data-tab="todas">Todas</button>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Expediente</th><th>Municipio</th><th>F.Petición</th><th>Plazo ppto.(3d)</th><th>F.Aprobación</th><th>Plazo ejec.(2m)</th><th style="text-align:right">Base SERVEO</th><th style="text-align:right">Penal.est.</th></tr></thead>
      <tbody id="plazoTbody"></tbody>
    </table></div>
  </div>`;

  sparkline('spkTotal',sparkD,'#74c69d');
  sparkline('spkPenal',sparkPen,'#e63946');

  const mkDonut=(id,legId,data)=>{
    if(!document.getElementById(id))return;
    const total=data.reduce((s,d)=>s+d.v,0)||1;
    const c=new Chart(document.getElementById(id),{type:'doughnut',data:{labels:data.map(d=>d.l),datasets:[{data:data.map(d=>d.v),backgroundColor:data.map(d=>d.c),borderWidth:0,hoverOffset:5}]},options:{responsive:true,maintainAspectRatio:false,cutout:'70%',plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.label}: ${ctx.parsed} (${Math.round(ctx.parsed/total*100)}%)`}}}}});
    charts.push(c);
    document.getElementById(legId).innerHTML=data.filter(d=>d.v>0).map(d=>`<div class="dl-item"><div class="dl-left"><span class="dl-dot" style="background:${d.c}"></span>${d.l}</div><div class="dl-pct">${d.v} · ${Math.round(d.v/total*100)}%</div></div>`).join('');
  };
  mkDonut('estChart','estLegend',[{l:'Pdte. presupuesto',v:estC['Pdte. presupuesto']||0,c:'#f4a261'},{l:'Aprobado',v:estC['Aprobado']||0,c:'#2d6a4f'},{l:'Pdte. aprobación',v:estC['Pdte. aprobación']||0,c:'#457b9d'},{l:'No procede',v:estC['No procede']||0,c:'#e63946'}]);
  mkDonut('obraChart','obraLegend',[{l:'Ejecutado',v:obraC['Ejecutado']||0,c:'#2d6a4f'},{l:'En ejecución',v:obraC['En ejecución']||0,c:'#40916c'},{l:'Facturado',v:obraC['Facturado']||0,c:'#6d597a'}]);

  if(munArr.length){const c=new Chart(document.getElementById('munChart'),{type:'bar',data:{labels:munArr.map(m=>m.name),datasets:[{label:'Base SERVEO',data:munArr.map(m=>m.value),backgroundColor:'#40916c',borderRadius:6}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>'€ '+c.parsed.x.toLocaleString('es-ES')}}},scales:{x:{grid:{color:'#e4ebe7'},ticks:{callback:v=>'€'+Math.round(v/1000)+'k',font:{size:11}}},y:{grid:{display:false},ticks:{font:{size:11}}}}}});charts.push(c);}

  if(allMeses.length&&document.getElementById('mesChart')){
    const c=new Chart(document.getElementById('mesChart'),{type:'bar',data:{labels:allMeses.map(monthLabel),datasets:[{label:'Facturación base',data:allMeses.map(m=>factMes[m]?factMes[m].base:0),backgroundColor:'#40916c',borderRadius:5,yAxisID:'y'},{label:'Penal. reales',data:allMeses.map(m=>penalRMes[m]||0),backgroundColor:'#fca5a5',borderRadius:5,yAxisID:'y'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{size:11},boxWidth:10,boxHeight:10}},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${euro(c.parsed.y)}`}}},scales:{y:{grid:{color:'#e4ebe7'},ticks:{callback:v=>v===0?'€0':'€'+Math.round(v/1000)+'k',font:{size:11}}},x:{grid:{display:false},ticks:{font:{size:11}}}}}});
    charts.push(c);
  }

  document.querySelectorAll('.ptab').forEach(t=>t.addEventListener('click',()=>renderPlazoTabla(t.dataset.tab)));
  renderPlazoTabla('vencidas');
  document.getElementById('plazoTbody').addEventListener('click',e=>{const el=e.target.closest('.exp-link');if(!el)return;const row=filteredRows.find(r=>r.exp===el.dataset.exp);if(row)openFicha(row);});

  const kpiMap={
    kpiTotal:    {title:'Todas las incidencias',                   fn:r=>true},
    kpiAprobadas:{title:'Presupuesto aprobado',                    fn:r=>r.estado==='Aprobado'},
    kpiPdtePpto: {title:'Pendiente presupuesto',                   fn:r=>r.estado==='Pdte. presupuesto'},
    kpiPdteApr:  {title:'Pendiente aprobación',                    fn:r=>r.estado==='Pdte. aprobación'},
    kpiFacturadas:{title:'Facturadas',                             fn:r=>r.esFacturada||r.obraLabel==='Facturado'},
    kpiNoProcede:{title:'No procede',                              fn:r=>r.estado==='No procede'},
    kpiPrior:    {title:'Prioritarias',                            fn:r=>r.prior},
    kpiVencidas: {title:'Vencidas +60d lab. sin facturar',         fn:r=>r.pen60==='vencida'},
    kpiAviso:    {title:'Aviso — menos de 15d lab. para vencer',   fn:r=>r.pen60==='aviso'},
    kpiPenalEst: {title:'Vencidas — penalización estimada (10%)',  fn:r=>r.pen60==='vencida'},
    kpiPenalReal:{title:'Con penalización real registrada',        fn:r=>r.penalReal>0},
  };
  Object.entries(kpiMap).forEach(([id,{title,fn}])=>{const el=document.getElementById(id);if(el)el.addEventListener('click',()=>openModal(title,filteredRows.filter(fn)));});
}

/* ─── CARGA ─── */
async function loadData(){
  document.getElementById('statusText').textContent='Actualizando…';
  try{
    const res=await fetch(GIST_RAW+'?t='+Date.now());
    if(!res.ok)throw new Error('HTTP '+res.status);
    const json=await res.json();
    rawRows=processRows(Array.isArray(json)?json:(json.value||[]));
    filteredRows=[...rawRows];
    populateFiltros();
    document.getElementById('navMapBadge').textContent=rawRows.length;
    if(currentTab==='dash')renderDashboard();else renderMap();
    document.getElementById('statusText').textContent='Act. '+new Date().toLocaleTimeString('es-ES');
  }catch(err){
    document.getElementById('statusText').textContent='Error: '+err.message;
    document.getElementById('content').innerHTML='<div class="placeholder"><strong>Sin conexión</strong>Verifica que Power Automate ha publicado el JSON en el Gist</div>';
  }
}

/* ─── NAV ─── */
function switchTab(tab){
  currentTab=tab;
  document.getElementById('navDash').classList.toggle('active',tab==='dash');
  document.getElementById('navMap').classList.toggle('active',tab==='map');
  document.getElementById('dashTab').style.display=tab==='dash'?'block':'none';
  document.getElementById('mapTab').style.display=tab==='map'?'block':'none';
  if(tab==='map')renderMap();
}
document.getElementById('navDash').addEventListener('click',()=>switchTab('dash'));
document.getElementById('navMap').addEventListener('click',()=>switchTab('map'));
document.getElementById('navRefresh').addEventListener('click',loadData);
document.getElementById('btnAplicar').addEventListener('click',applyFilters);
document.getElementById('btnLimpiar').addEventListener('click',limpiarFiltros);
document.getElementById('filtroTipoFecha').addEventListener('change',populateFiltros);
document.getElementById('filtroMes').addEventListener('change',()=>{if(document.getElementById('filtroMes').value){document.getElementById('filtroDesde').value='';document.getElementById('filtroHasta').value='';}});
document.getElementById('filtroDesde').addEventListener('change',()=>{if(document.getElementById('filtroDesde').value)document.getElementById('filtroMes').value='';});
document.getElementById('filtroHasta').addEventListener('change',()=>{if(document.getElementById('filtroHasta').value)document.getElementById('filtroMes').value='';});
document.getElementById('modalClose').addEventListener('click',()=>document.getElementById('modalOverlay').style.display='none');
document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('modalOverlay'))document.getElementById('modalOverlay').style.display='none';});
document.getElementById('fichaClose').addEventListener('click',()=>document.getElementById('fichaOverlay').style.display='none');
document.getElementById('fichaOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('fichaOverlay'))document.getElementById('fichaOverlay').style.display='none';});
document.getElementById('btnDescargaExcel').addEventListener('click',descargarExcel);
document.getElementById('btnDescargaPDF').addEventListener('click',descargarPDF);
document.getElementById('modalBody').addEventListener('click',e=>{const el=e.target.closest('.exp-link');if(!el)return;const row=rawRows.find(r=>r.exp===el.dataset.exp);if(row)openFicha(row);});

loadData();
setInterval(loadData,REFRESH_MS);
</script>
