<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVRA Jaén · Control de Incidencias</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #f8f8f6;
  --surface: #ffffff;
  --surface-2: #f2f2ef;
  --border: #e8e8e4;
  --text-primary: #18181b;
  --text-secondary: #71717a;
  --text-tertiary: #a1a1aa;
  --accent: #4f46e5;
  --accent-light: #eef2ff;
  --accent-mid: #818cf8;
  --success: #059669;
  --success-light: #ecfdf5;
  --warning: #d97706;
  --warning-light: #fffbeb;
  --danger: #dc2626;
  --danger-light: #fef2f2;
  --purple: #7c3aed;
  --purple-light: #f5f3ff;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 16px rgba(0,0,0,.07), 0 1px 4px rgba(0,0,0,.04);
  --radius: 14px;
  --radius-sm: 8px;
  --radius-xs: 5px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body { background: var(--bg); color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; min-height: 100vh; }

/* ── LAYOUT ── */
.shell { max-width: 1320px; margin: 0 auto; padding: 28px 24px 48px; }

/* ── HEADER ── */
.header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 28px; gap: 16px; flex-wrap: wrap; }
.header-left {}
.header-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
.header-title { font-size: 22px; font-weight: 700; letter-spacing: -.02em; color: var(--text-primary); }
.header-sub { font-size: 12px; color: var(--text-secondary); margin-top: 4px; display: flex; align-items: center; gap: 6px; }
.header-sub .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); display: inline-block; box-shadow: 0 0 0 3px rgba(5,150,105,.15); }
.header-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ── BUTTONS ── */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text-primary); transition: all .15s; font-family: inherit; box-shadow: var(--shadow-sm); }
.btn:hover { background: var(--surface-2); border-color: #d4d4d0; }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { background: #4338ca; border-color: #4338ca; }
.btn-ghost { border-color: transparent; background: transparent; box-shadow: none; }
.btn-ghost:hover { background: var(--surface-2); }

/* ── FILTER BAR ── */
.filter-bar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; box-shadow: var(--shadow-sm); }
.fg { display: flex; flex-direction: column; gap: 5px; }
.fg label { font-size: 11px; font-weight: 600; color: var(--text-secondary); letter-spacing: .04em; text-transform: uppercase; }
.fg select, .fg input { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 11px; font-size: 12px; color: var(--text-primary); background: var(--surface-2); font-family: inherit; outline: none; transition: border-color .15s; min-width: 150px; }
.fg select:focus, .fg input:focus { border-color: var(--accent); background: #fff; }

/* ── KPI GRID ── */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 24px; }
.kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 20px 16px; box-shadow: var(--shadow-sm); cursor: pointer; transition: box-shadow .2s, transform .15s, border-color .15s; position: relative; overflow: hidden; }
.kpi-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); border-color: #d4d4d0; }
.kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: var(--radius) var(--radius) 0 0; }
.kpi-card.accent::before { background: var(--accent); }
.kpi-card.success::before { background: var(--success); }
.kpi-card.warning::before { background: var(--warning); }
.kpi-card.danger::before { background: var(--danger); }
.kpi-card.purple::before { background: var(--purple); }
.kpi-card.neutral::before { background: var(--text-tertiary); }
.kpi-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); letter-spacing: .04em; text-transform: uppercase; margin-bottom: 10px; }
.kpi-value { font-size: 30px; font-weight: 800; letter-spacing: -.03em; line-height: 1; margin-bottom: 8px; }
.kpi-card.accent .kpi-value { color: var(--accent); }
.kpi-card.success .kpi-value { color: var(--success); }
.kpi-card.warning .kpi-value { color: var(--warning); }
.kpi-card.danger .kpi-value { color: var(--danger); }
.kpi-card.purple .kpi-value { color: var(--purple); }
.kpi-sub { font-size: 11px; color: var(--text-tertiary); line-height: 1.5; }
.kpi-sub .mes { display: block; color: var(--text-secondary); font-weight: 500; }
.kpi-sparkline { margin-top: 12px; height: 36px; }

/* ── ALERT BANNER ── */
.alert-banner { background: linear-gradient(135deg, #fef2f2 0%, #fff5f5 100%); border: 1px solid #fecaca; border-radius: var(--radius); padding: 20px 24px; margin-bottom: 24px; display: flex; flex-wrap: wrap; gap: 28px; align-items: center; }
.alert-main {}
.alert-label { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--danger); margin-bottom: 6px; }
.alert-amount { font-size: 32px; font-weight: 800; color: var(--danger); letter-spacing: -.03em; cursor: pointer; }
.alert-amount:hover { opacity: .8; }
.alert-sub { font-size: 11px; color: #b91c1c; margin-top: 4px; }
.alert-stats { display: flex; gap: 24px; flex-wrap: wrap; }
.alert-stat {}
.alert-stat-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); letter-spacing: .04em; text-transform: uppercase; margin-bottom: 4px; }
.alert-stat-val { font-size: 22px; font-weight: 700; letter-spacing: -.02em; cursor: pointer; }
.alert-stat-val.danger { color: var(--danger); }
.alert-stat-val.warning { color: var(--warning); }
.alert-stat-val.success { color: var(--success); }

/* ── CHARTS GRID ── */
.charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.charts-row.triple { grid-template-columns: 1fr 1fr 1fr; }
@media(max-width:900px){ .charts-row, .charts-row.triple { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow-sm); margin-bottom: 16px; }
.card-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
.card-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.card-subtitle { font-size: 11px; color: var(--text-tertiary); }
.chart-wrap { position: relative; }
.chart-wrap.h180 { height: 180px; }
.chart-wrap.h240 { height: 240px; }
.chart-wrap.h280 { height: 280px; }
.chart-wrap.h320 { height: 320px; }

/* ── DONUT LEGEND ── */
.donut-legend { display: flex; flex-direction: column; gap: 7px; margin-top: 14px; }
.dl-item { display: flex; align-items: center; justify-content: space-between; font-size: 11px; }
.dl-left { display: flex; align-items: center; gap: 7px; color: var(--text-secondary); }
.dl-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.dl-pct { font-weight: 600; color: var(--text-primary); }

/* ── TABS ── */
.tabs { display: flex; gap: 4px; margin-bottom: 14px; background: var(--surface-2); border-radius: var(--radius-sm); padding: 4px; width: fit-content; }
.tab { padding: 6px 14px; border-radius: var(--radius-xs); font-size: 12px; font-weight: 500; cursor: pointer; color: var(--text-secondary); transition: all .15s; border: none; background: transparent; font-family: inherit; }
.tab.active { background: var(--surface); color: var(--text-primary); font-weight: 600; box-shadow: var(--shadow-sm); }

/* ── TABLE ── */
.tbl-wrap { overflow-x: auto; border-radius: var(--radius-sm); }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
thead th { text-align: left; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-tertiary); padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--surface); }
tbody td { padding: 10px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; white-space: nowrap; color: var(--text-primary); }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--surface-2); }

/* ── BADGES ── */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; letter-spacing: .03em; white-space: nowrap; }
.badge.ok { background: var(--success-light); color: var(--success); }
.badge.warn { background: var(--warning-light); color: var(--warning); }
.badge.danger { background: var(--danger-light); color: var(--danger); }
.badge.neutral { background: var(--surface-2); color: var(--text-secondary); }
.badge.info { background: var(--accent-light); color: var(--accent); }

/* ── EXP LINK ── */
.exp-link { color: var(--accent); font-weight: 600; cursor: pointer; }
.exp-link:hover { text-decoration: underline; }

/* ── MODAL ── */
.overlay { position: fixed; inset: 0; background: rgba(24,24,27,.5); backdrop-filter: blur(4px); z-index: 999; display: flex; align-items: center; justify-content: center; padding: 24px; }
.modal { background: var(--surface); border-radius: var(--radius); width: 100%; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 24px 64px rgba(0,0,0,.18); }
.modal.sm { max-width: 820px; }
.modal.lg { max-width: 1140px; }
.modal-hdr { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.modal-hdr h2 { font-size: 15px; font-weight: 700; }
.modal-hdr-actions { display: flex; gap: 8px; }
.modal-body { overflow: auto; padding: 24px; flex: 1; }
.modal-close { background: none; border: none; cursor: pointer; color: var(--text-secondary); font-size: 18px; padding: 4px 8px; border-radius: var(--radius-xs); font-family: inherit; }
.modal-close:hover { background: var(--surface-2); }

/* ── FICHA ── */
.ficha-section { margin-bottom: 24px; }
.ficha-section-title { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.ficha-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
.ficha-field .fl { font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 4px; }
.ficha-field .fv { font-size: 13px; font-weight: 500; color: var(--text-primary); }
.ficha-field .fv.large { font-size: 18px; font-weight: 700; color: var(--accent); }
.recl { background: var(--surface-2); border-radius: var(--radius-sm); padding: 14px 16px; font-size: 12px; line-height: 1.6; color: var(--text-secondary); white-space: pre-wrap; border-left: 3px solid var(--accent); }

/* ── STATUS BAR ── */
.status-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
.status-left { font-size: 11px; color: var(--text-tertiary); }
.status-left span { color: var(--text-secondary); font-weight: 500; }
#statusDot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); display: inline-block; margin-right: 5px; }
#statusDot.loading { background: var(--warning); }
#statusDot.error { background: var(--danger); }

/* ── PLACEHOLDER ── */
.placeholder { text-align: center; padding: 48px 24px; color: var(--text-tertiary); font-size: 13px; }
.placeholder strong { display: block; font-size: 15px; color: var(--text-secondary); margin-bottom: 6px; }
</style>
</head>
<body>
<div class="shell">

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <div class="header-eyebrow">Serveo · Contrato AVRA</div>
      <h1 class="header-title">Control de Incidencias — Jaén</h1>
      <div class="header-sub">
        <span class="dot"></span>
        <span id="statusText">Cargando datos en vivo…</span>
      </div>
    </div>
    <div class="header-right">
      <button class="btn" id="refreshBtn">&#8635; Actualizar</button>
    </div>
  </div>

  <!-- FILTER BAR -->
  <div class="filter-bar">
    <div class="fg">
      <label>Filtrar por fecha</label>
      <select id="filtroTipoFecha">
        <option value="peticion">F. Petición presupuesto</option>
        <option value="aprobacion">F. Aprobación AVRA</option>
        <option value="conformidad">F. Conformidad</option>
        <option value="facturado">F. Facturado</option>
      </select>
    </div>
    <div class="fg">
      <label>Mes / Año</label>
      <select id="filtroMes"><option value="">— Todos —</option></select>
    </div>
    <div class="fg">
      <label>Rango desde</label>
      <input type="date" id="filtroDesde">
    </div>
    <div class="fg">
      <label>Hasta</label>
      <input type="date" id="filtroHasta">
    </div>
    <div class="fg">
      <label>Municipio</label>
      <select id="filtroMunicipio"><option value="">— Todos —</option></select>
    </div>
    <div class="fg">
      <label>Estado</label>
      <select id="filtroEstado"><option value="">— Todos —</option></select>
    </div>
    <div style="display:flex;gap:8px;align-items:flex-end;">
      <button class="btn btn-primary" id="btnAplicar">Aplicar</button>
      <button class="btn" id="btnLimpiar">Limpiar</button>
    </div>
  </div>

  <!-- CONTENT -->
  <div id="content">
    <div class="placeholder"><strong>Conectando…</strong>Cargando datos del Gist de GitHub</div>
  </div>

</div>

<!-- FICHA MODAL -->
<div class="overlay" id="fichaOverlay" style="display:none;">
  <div class="modal sm">
    <div class="modal-hdr">
      <h2 id="fichaTitle">Ficha de expediente</h2>
      <button class="modal-close" id="fichaClose">✕</button>
    </div>
    <div class="modal-body" id="fichaBody"></div>
  </div>
</div>

<!-- LISTADO MODAL -->
<div class="overlay" id="modalOverlay" style="display:none;">
  <div class="modal lg">
    <div class="modal-hdr">
      <h2 id="modalTitle">Incidencias</h2>
      <div class="modal-hdr-actions">
        <button class="btn" id="btnDescargaExcel">⬇ Excel</button>
        <button class="btn" id="btnDescargaPDF">⬇ PDF</button>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
const GIST_RAW = "https://gist.githubusercontent.com/cferberia-cmd/428e16516bae61ac35c15be1c8b6fd8f/raw/incidencias.json";
const REFRESH_MS = 5 * 60 * 1000;
let charts = [], rawRows = [], filteredRows = [], modalRows = [], modalTitleText = '';
let KEYS = {};

/* ─── UTILS ─── */
const norm = s => s ? String(s).trim().toUpperCase().replace(/[\s\n]+/g,' ') : '';
function findKey(row, candidates) {
  const keys = Object.keys(row);
  for (const c of candidates) { const k = keys.find(k => norm(k).includes(c)); if (k) return k; }
  return null;
}
function parseNum(v) {
  if (v === null || v === undefined || v === '') return 0;
  if (typeof v === 'number') return v;
  const n = parseFloat(String(v).replace(/[^\d,.-]/g,'').replace(/\.(?=\d{3})/g,'').replace(',','.'));
  return isNaN(n) ? 0 : n;
}
function excelDate(v) {
  if (!v && v !== 0) return null;
  if (typeof v === 'string') {
    const s = v.trim();
    if (norm(s).includes('NO PROCEDE') || norm(s).includes('PROCEDE')) return null;
    if (s.includes('/')) { const p = s.split('/'); if (p.length === 3) { const d = new Date(parseInt(p[2]), parseInt(p[1])-1, parseInt(p[0])); return isNaN(d.getTime()) ? null : d; } }
    if (s.includes('-')) { const d = new Date(s); return isNaN(d.getTime()) ? null : d; }
  }
  const n = typeof v === 'number' ? v : parseFloat(v);
  if (isNaN(n) || n < 1) return null;
  return new Date(Math.round((n - 25569) * 86400 * 1000));
}
const fmtDate = v => { const d = excelDate(v); return d ? d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'}) : '—'; };
const monthKey = d => d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}` : null;
const monthLabel = k => { if (!k) return ''; const [y,m] = k.split('-'); return `${['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'][parseInt(m)-1]} ${y}`; };
function addDiasLab(d, n) { let cur = new Date(d), added = 0; while (added < n) { cur.setDate(cur.getDate()+1); if (cur.getDay() !== 0 && cur.getDay() !== 6) added++; } return cur; }
function diasLabRestantes(desde, hasta) { if (!desde || !hasta) return 0; let count = 0, cur = new Date(desde); const end = new Date(hasta); while (cur < end) { cur.setDate(cur.getDate()+1); if (cur.getDay() !== 0 && cur.getDay() !== 6) count++; } return count; }
const add2Meses = d => { const r = new Date(d); r.setMonth(r.getMonth()+2); return r; };
function normEstado(s) { s = norm(s); if (s.includes('NO PROCEDE')) return 'No procede'; if (s.includes('PENDIENTE PRESUPUESTO')) return 'Pdte. presupuesto'; if (s.includes('PENDIENTE APROBACION')||s.includes('PENDIENTE APROBACIÓN')) return 'Pdte. aprobación'; if (s.includes('PRESUPUESTO APROBADO')) return 'Aprobado'; return s || 'Sin estado'; }
function normObra(s) { s = norm(s); if (s.includes('FACTURADO')) return 'Facturado'; if (s.includes('EN EJECUCION')||s.includes('EN EJECUCIÓN')) return 'En ejecución'; if (s.includes('EJECUTADO')) return 'Ejecutado'; return s || ''; }
function normProv(s) { s = norm(s); if (s.includes('CEION')&&s.includes('ALGUACIL')) return 'CEION-Adán Alguacil'; if (s.includes('CEION')) return 'CEION'; if (s.includes('SERVEO')) return 'SERVEO'; return s || 'Sin asignar'; }
const euro = (v, d=0) => '€ ' + Math.round(v).toLocaleString('es-ES');
const euro2 = v => '€ ' + v.toLocaleString('es-ES',{minimumFractionDigits:2});
function alertBadge(s, d) {
  if (s==='excluida') return `<span class="badge neutral">Excluida</span>`;
  if (s==='cumplido') return `<span class="badge ok">✓ OK</span>`;
  if (s==='vencido')  return `<span class="badge danger">⚠ Vencido</span>`;
  if (s==='warning')  return `<span class="badge warn">⏱ ${d}d</span>`;
  if (s==='ok')       return `<span class="badge ok">✓ ${d}d</span>`;
  return `<span class="badge neutral">—</span>`;
}
function destroyCharts() { charts.forEach(c => c.destroy()); charts = []; }

/* ─── SPARKLINE ─── */
function sparkline(canvasId, data, color) {
  const ctx = document.getElementById(canvasId);
  if (!ctx || !data.length) return;
  const c = new Chart(ctx, {
    type: 'line',
    data: { labels: data.map((_,i)=>i), datasets: [{ data, borderColor: color, borderWidth: 1.5, fill: true, backgroundColor: color+'18', tension: .4, pointRadius: 0 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { enabled: false } }, scales: { x: { display: false }, y: { display: false } }, animation: false }
  });
  charts.push(c);
}

/* ─── PROCESS ROWS ─── */
function processRows(rows) {
  if (!rows.length) return [];
  const s = rows[0];
  KEYS = {
    exp: findKey(s,['NUMERO DE EXPEDIENTE','EXPEDIENTE']),
    titular: findKey(s,['TITULAR O REPRESENTANTE','TITULAR']),
    telefono: findKey(s,['TELÉFONO','TELEFONO']),
    tipoVia: findKey(s,['TIPO VÍA','TIPO VIA']),
    direccion: findKey(s,['DIRECCIÓN','DIRECCION']),
    numero: findKey(s,['Nº']),
    bloque: findKey(s,['BLOQUE']),
    piso: findKey(s,['PISO']),
    puerta: findKey(s,['PUERTA']),
    provincia: findKey(s,['PROVINCIA']),
    reclamacion: findKey(s,['CONTENIDO RECLAMACIÓN','CONTENIDO RECLAMACION']),
    est: findKey(s,['ESTADO SERVEO','ESTADO']),
    prov: findKey(s,['PROVEEDOR']),
    mun: findKey(s,['MUNICIPIO']),
    base: findKey(s,['BASE PRESUPUESTO SERVEO']),
    total: findKey(s,['TOTAL']),
    obra: findKey(s,['ESTADO OBRA']),
    fPet: findKey(s,['FECHA DE PETICION DE PRESUPUESTO','FECHA PETICION']),
    fPres: findKey(s,['FECHA PRESUPUESTO']),
    fApr: findKey(s,['FECHA APROBACION AVRA','APROBADO POR AVRA']),
    fCon: findKey(s,['FECHA CONFORMIDAD']),
    fFact: findKey(s,['FACTURADO']),
    penal: findKey(s,['PENALIZACION','PENALIZACIÓN']),
    prior: findKey(s,['PRIORITARIO'])
  };
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  return rows.map(r => {
    const estado = normEstado(KEYS.est ? r[KEYS.est] : null);
    const obraLabel = normObra(KEYS.obra ? r[KEYS.obra] : '');
    const base = parseNum(KEYS.base ? r[KEYS.base] : 0);
    const total = parseNum(KEYS.total ? r[KEYS.total] : 0);
    const penalReal = parseNum(KEYS.penal ? r[KEYS.penal] : 0);
    const fPet  = excelDate(KEYS.fPet  ? r[KEYS.fPet]  : null);
    const fPres = excelDate(KEYS.fPres ? r[KEYS.fPres] : null);
    const fApr  = excelDate(KEYS.fApr  ? r[KEYS.fApr]  : null);
    const fCon  = excelDate(KEYS.fCon  ? r[KEYS.fCon]  : null);
    const fFact = excelDate(KEYS.fFact ? r[KEYS.fFact] : null);
    const esFacturada = fFact !== null;
    const excluida = (obraLabel === 'Facturado' || estado === 'No procede' || esFacturada);
    let p1Status = 'sin-fecha', p1Dias = null, p2Status = 'sin-fecha', p2Dias = null, penalEst = 0;
    if (!excluida) {
      if (fPet) {
        const lim1 = addDiasLab(fPet, 3);
        if (fPres) { p1Status = fPres <= lim1 ? 'cumplido' : 'vencido'; if (p1Status==='vencido') penalEst += base*.1; }
        else { const dr = diasLabRestantes(hoy,lim1); if (hoy>lim1) { p1Status='vencido'; penalEst+=base*.1; } else if(dr<=3){ p1Status='warning'; p1Dias=dr; } else { p1Status='ok'; p1Dias=dr; } }
      }
      if (fApr) {
        const lim2 = add2Meses(fApr);
        if (obraLabel==='Ejecutado'||obraLabel==='Facturado') { p2Status='cumplido'; }
        else { const dr = diasLabRestantes(hoy,lim2); if (hoy>lim2) { p2Status='vencido'; penalEst+=base*.1; } else if(dr<=3){ p2Status='warning'; p2Dias=dr; } else { p2Status='ok'; p2Dias=dr; } }
      }
    } else { p1Status='excluida'; p2Status='excluida'; }
    return { raw:r, exp:r[KEYS.exp]||'—', municipio:KEYS.mun?String(r[KEYS.mun]||'').trim():'—', estado, obraLabel, prov:normProv(KEYS.prov?r[KEYS.prov]:null), base, total, penalReal, penalEst, excluida, esFacturada, fPet, fPres, fApr, fCon, fFact, p1Status, p1Dias, p2Status, p2Dias, prior:!!(KEYS.prior&&r[KEYS.prior]&&norm(r[KEYS.prior])!=='') };
  });
}

/* ─── FILTROS ─── */
function getDateForField(row, campo) {
  if (campo==='peticion') return row.fPet;
  if (campo==='aprobacion') return row.fApr;
  if (campo==='conformidad') return row.fCon;
  if (campo==='facturado') return row.fFact;
  return null;
}
function applyFilters() {
  const campo = document.getElementById('filtroTipoFecha').value;
  const mes = document.getElementById('filtroMes').value;
  const desdeVal = document.getElementById('filtroDesde').value;
  const hastaVal = document.getElementById('filtroHasta').value;
  const desde = desdeVal ? new Date(desdeVal) : null;
  const hasta = hastaVal ? new Date(hastaVal) : null;
  const mun = document.getElementById('filtroMunicipio').value;
  const est = document.getElementById('filtroEstado').value;
  filteredRows = rawRows.filter(r => {
    const fd = getDateForField(r, campo);
    if (mes) { const mk = fd ? monthKey(fd) : null; if (mk !== mes) return false; }
    if (desde && (!fd || fd < desde)) return false;
    if (hasta) { const h = new Date(hasta); h.setHours(23,59,59); if (!fd || fd > h) return false; }
    if (mun && r.municipio !== mun) return false;
    if (est && r.estado !== est) return false;
    return true;
  });
  renderDashboard();
}
function limpiarFiltros() {
  ['filtroMes','filtroMunicipio','filtroEstado'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('filtroDesde').value = '';
  document.getElementById('filtroHasta').value = '';
  filteredRows = [...rawRows];
  renderDashboard();
}
function populateFiltros() {
  const campo = document.getElementById('filtroTipoFecha').value;
  const meses = new Set(), municipios = new Set(), estados = new Set();
  rawRows.forEach(r => {
    const fd = getDateForField(r, campo);
    const mk = monthKey(fd); if (mk) meses.add(mk);
    if (r.municipio && r.municipio !== '—') municipios.add(r.municipio);
    if (r.estado) estados.add(r.estado);
  });
  const populate = (id, items, cur) => {
    document.getElementById(id).innerHTML = '<option value="">— Todos —</option>' + [...items].sort().map(v => `<option value="${v}"${v===cur?' selected':''}>${v.includes('-')&&v.length===7?monthLabel(v):v}</option>`).join('');
  };
  populate('filtroMes', meses, document.getElementById('filtroMes').value);
  populate('filtroMunicipio', municipios, document.getElementById('filtroMunicipio').value);
  populate('filtroEstado', estados, document.getElementById('filtroEstado').value);
}

function renderDashboard() {
  destroyCharts();
  const rows = filteredRows;
  if (!rows.length) { document.getElementById('content').innerHTML = '<div class="placeholder"><strong>Sin resultados</strong>Prueba a cambiar los filtros aplicados</div>'; return; }

  const campo = document.getElementById('filtroTipoFecha').value;
  const estC={}, obraC={}, provC={}, munT={};

      <button class="tab ptab" data-tab="aviso">⏱ Aviso <span style="background:var(--warning-light);color:var(--warning);padding:1px 6px;border-radius:20px;font-size:10px;font-weight:700;margin-left:4px">${nWarn}</span></button>
      <button class="tab ptab" data-tab="ok">✓ En plazo <span style="background:var(--success-light);color:var(--success);padding:1px 6px;border-radius:20px;font-size:10px;font-weight:700;margin-left:4px">${nOk}</span></button>
      <button class="tab ptab" data-tab="todas">Todas <span style="background:var(--accent-light);color:var(--accent);padding:1px 6px;border-radius:20px;font-size:10px;font-weight:700;margin-left:4px">${rows.length}</span></button>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>Expediente</th><th>Municipio</th><th>F. Petición</th><th>Plazo ppto. (3d)</th>
          <th>F. Aprobación</th><th>Plazo ejec. (2m)</th>
          <th style="text-align:right">Base SERVEO</th><th style="text-align:right">Penal. estimada</th>
        </tr></thead>
        <tbody id="plazoTbody"></tbody>
      </table>
    </div>
  </div>
  `;

  /* ── CHARTS ── */
  // Sparklines
  sparkline('spkTotal', sparkEstados, '#4f46e5');
  sparkline('spkPenal', mesesAll.map(m=>penalEMes[m]||0), '#dc2626');

  // Donut helper
  const makeDonut = (id, legendId, data) => {
    if (!document.getElementById(id)) return;
    const total = data.reduce((s,d)=>s+d.v,0)||1;
    const c = new Chart(document.getElementById(id), {
      type:'doughnut',
      data:{ labels:data.map(d=>d.l), datasets:[{ data:data.map(d=>d.v), backgroundColor:data.map(d=>d.c), borderWidth:0, hoverOffset:4 }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:'68%', plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: ctx => `${ctx.label}: ${ctx.parsed} (${Math.round(ctx.parsed/total*100)}%)` } } } }
    });
    charts.push(c);
    document.getElementById(legendId).innerHTML = data.filter(d=>d.v>0).map(d=>`<div class="dl-item"><div class="dl-left"><span class="dl-dot" style="background:${d.c}"></span>${d.l}</div><div class="dl-pct">${d.v} · ${Math.round(d.v/total*100)}%</div></div>`).join('');
  };

  makeDonut('estChart','estLegend',[
    {l:'Pdte. presupuesto', v:estC['Pdte. presupuesto']||0, c:'#d97706'},
    {l:'Aprobado',          v:estC['Aprobado']||0,          c:'#059669'},
    {l:'Pdte. aprobación',  v:estC['Pdte. aprobación']||0,  c:'#4f46e5'},
    {l:'No procede',        v:estC['No procede']||0,        c:'#dc2626'},
  ]);
  makeDonut('obraChart','obraLegend',[
    {l:'Ejecutado',     v:obraC['Ejecutado']||0,     c:'#059669'},
    {l:'En ejecución',  v:obraC['En ejecución']||0,  c:'#4f46e5'},
    {l:'Facturado',     v:obraC['Facturado']||0,     c:'#7c3aed'},
  ]);

  // Municipios horizontal bar
  if (munArr.length) {
    const h = Math.max(180, munArr.length * 30);
    document.querySelector('#munChart').parentElement.style.height = h + 'px';
    const c = new Chart(document.getElementById('munChart'), {
      type:'bar',
      data:{ labels:munArr.map(m=>m.name), datasets:[{ label:'Base SERVEO', data:munArr.map(m=>m.value), backgroundColor:'#818cf8', borderRadius:4 }] },
      options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: c=>'€ '+c.parsed.x.toLocaleString('es-ES') } } },
        scales:{ x:{ grid:{color:'#f0f0ed'}, ticks:{ callback:v=>'€'+Math.round(v/1000)+'k', font:{size:11} } }, y:{ grid:{display:false}, ticks:{font:{size:11}} } }
      }
    });
    charts.push(c);
  }

  // Evolución mensual
  if (allMeses.length && document.getElementById('mesChart')) {
    const c = new Chart(document.getElementById('mesChart'), {
      type:'bar',
      data:{
        labels: allMeses.map(monthLabel),
        datasets:[
          { label:'Facturación base', data:allMeses.map(m=>factMes[m]?factMes[m].base:0), backgroundColor:'#818cf8', borderRadius:4, yAxisID:'y' },
          { label:'Penal. real',      data:allMeses.map(m=>penalRMes[m]||0), backgroundColor:'#fca5a5', borderRadius:4, yAxisID:'y' },
          { label:'Penal. estimada',  data:allMeses.map(m=>penalEMes[m]||0), type:'line', borderColor:'#d97706', backgroundColor:'#d9770612', fill:true, tension:.4, pointRadius:4, pointBackgroundColor:'#d97706', yAxisID:'y' }
        ]
      },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{position:'top', labels:{font:{size:11},boxWidth:10,boxHeight:10}}, tooltip:{ callbacks:{ label: c=>`${c.dataset.label}: ${euro(c.parsed.y)}` } } },
        scales:{ y:{ grid:{color:'#f0f0ed'}, ticks:{ callback:v=>v===0?'€0':'€'+Math.round(v/1000)+'k', font:{size:11} } }, x:{ grid:{display:false}, ticks:{font:{size:11}} } }
      }
    });
    charts.push(c);
  }

  /* ── EVENTOS TABLA / KPIs ── */
  document.querySelectorAll('.ptab').forEach(t => t.addEventListener('click', () => renderPlazoTabla(t.dataset.tab)));
  renderPlazoTabla('vencidas');
  document.getElementById('plazoTbody').addEventListener('click', e => {
    const el = e.target.closest('.exp-link'); if (!el) return;
    const row = filteredRows.find(r => r.exp===el.dataset.exp); if (row) openFicha(row);
  });

  const kpiMap = {
    kpiTotal:      { title:'Todas las incidencias',           fn: r=>true },
    kpiAprobadas:  { title:'Presupuesto aprobado',            fn: r=>r.estado==='Aprobado' },
    kpiPdtePpto:   { title:'Pendiente presupuesto',           fn: r=>r.estado==='Pdte. presupuesto' },
    kpiPdteApr:    { title:'Pendiente aprobación',            fn: r=>r.estado==='Pdte. aprobación' },
    kpiFacturadas: { title:'Facturadas',                      fn: r=>r.esFacturada||r.obraLabel==='Facturado' },
    kpiNoProcede:  { title:'No procede',                      fn: r=>r.estado==='No procede' },
    kpiPrior:      { title:'Prioritarias',                    fn: r=>r.prior },
    kpiVencidas:   { title:'Plazo vencido',                   fn: r=>r.p1Status==='vencido'||r.p2Status==='vencido' },
    kpiAviso:      { title:'Aviso ≤ 3 días laborables',       fn: r=>r.p1Status==='warning'||r.p2Status==='warning' },
    kpiPenalEst:   { title:'Con penalización estimada',       fn: r=>r.penalEst>0 },
    kpiPenalReal:  { title:'Con penalización real registrada',fn: r=>r.penalReal>0 },
  };
  Object.entries(kpiMap).forEach(([id,{title,fn}]) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('click', () => openModal(title, filteredRows.filter(fn)));
  });
}

/* ─── CARGA ─── */
async function loadData() {
  document.getElementById('statusText').textContent = 'Actualizando datos…';
  try {
    const res = await fetch(GIST_RAW + '?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    rawRows = processRows(Array.isArray(json) ? json : (json.value||[]));
    filteredRows = [...rawRows];
    populateFiltros();
    renderDashboard();
    document.getElementById('statusText').textContent = 'Actualizado: ' + new Date().toLocaleString('es-ES');
  } catch(err) {
    document.getElementById('statusText').textContent = 'Error al cargar: ' + err.message;
    document.getElementById('content').innerHTML = '<div class="placeholder"><strong>Sin conexión con los datos</strong>Verifica que Power Automate ha publicado el JSON en el Gist correctamente</div>';
  }
}

/* ─── EVENTOS GLOBALES ─── */
document.getElementById('refreshBtn').addEventListener('click', loadData);
document.getElementById('btnAplicar').addEventListener('click', applyFilters);
document.getElementById('btnLimpiar').addEventListener('click', limpiarFiltros);
document.getElementById('filtroTipoFecha').addEventListener('change', populateFiltros);
document.getElementById('filtroMes').addEventListener('change', () => { if(document.getElementById('filtroMes').value){document.getElementById('filtroDesde').value='';document.getElementById('filtroHasta').value='';} });
document.getElementById('filtroDesde').addEventListener('change', () => { if(document.getElementById('filtroDesde').value) document.getElementById('filtroMes').value=''; });
document.getElementById('filtroHasta').addEventListener('change', () => { if(document.getElementById('filtroHasta').value) document.getElementById('filtroMes').value=''; });
document.getElementById('modalClose').addEventListener('click', () => document.getElementById('modalOverlay').style.display='none');
document.getElementById('modalOverlay').addEventListener('click', e => { if(e.target===document.getElementById('modalOverlay')) document.getElementById('modalOverlay').style.display='none'; });
document.getElementById('fichaClose').addEventListener('click', () => document.getElementById('fichaOverlay').style.display='none');
document.getElementById('fichaOverlay').addEventListener('click', e => { if(e.target===document.getElementById('fichaOverlay')) document.getElementById('fichaOverlay').style.display='none'; });
document.getElementById('btnDescargaExcel').addEventListener('click', descargarExcel);
document.getElementById('btnDescargaPDF').addEventListener('click', descargarPDF);
document.getElementById('modalBody').addEventListener('click', e => {
  const el = e.target.closest('.exp-link'); if(!el) return;
  const row = rawRows.find(r => r.exp===el.dataset.exp); if(row) openFicha(row);
});

loadData();
setInterval(loadData, REFRESH_MS);
</script>
</body>
